<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하객 주인공 쿠션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 30s vertical (9:16) B-grade cartoon cushion ad: crashing an ex's wedding, speech-bubble dialogue with babble voices, product hidden behind an "광고" mosaic. */
:root{color-scheme:dark;--bg:#0e0e10;--panel:#18181c;--fg:#f1f1f1;--muted:#9a9aa3;--accent:#ff6fa8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Jua',system-ui,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:16px}
h1{font-weight:400;font-size:22px;margin:4px 0 12px}
h1 span{color:var(--accent)}
canvas{width:100%;max-width:420px;margin:0 auto;aspect-ratio:9/16;display:block;background:#000;border-radius:12px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;font-size:16px;background:var(--panel);color:var(--fg);border:1px solid #2c2c33;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a4a55}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:84px;text-align:right}
p.note{color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>스캘프 랩 애니 <span>하객 주인공 쿠션 (9:16 · 30초)</span></h1>
  <canvas id="cv"></canvas>
  <div class="bar">
    <button id="play">▶ 재생</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="snd">🔊</button>
  </div>
  <p class="note">화면을 눌러도 재생/정지돼요. 대사는 말풍선, 목소리는 옹알옹알 효과음이에요. 소리는 전부 브라우저에서 합성됩니다.</p>
</div>
<script>
const W = 720, H = 1280;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

const OUT = '#2a1a26';
const FONT = "'Jua',sans-serif";
const BPM = 124, BEAT = 60 / BPM;

// ---------- math ----------
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const backOut = t => { t = clamp(t, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---------- primitives ----------
function ink(lw = 4) { g.strokeStyle = OUT; g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; }
function fs(fill, lw = 4) { if (fill) { g.fillStyle = fill; g.fill(); } ink(lw); g.stroke(); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), rot, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function line(x1, y1, x2, y2, lw = 4) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); ink(lw); g.stroke(); }

function popText(txt, x, y, size, fill, rot = 0, sc = 1) {
  if (sc <= 0) return;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc, sc);
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = size * 0.22; g.strokeStyle = OUT; g.strokeText(txt, 0, 0);
  g.lineWidth = size * 0.11; g.strokeStyle = '#fff'; g.strokeText(txt, 0, 0);
  g.fillStyle = fill; g.fillText(txt, 0, 0);
  g.restore();
}

function star(x, y, r, col = '#fff6b0', rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rad = i % 2 ? r * 0.32 : r; g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  g.closePath(); fs(col, 3); g.restore();
}
function sparkles(cx, cy, rad, n, T, k = 1) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + T * 0.6, tw = 0.5 + 0.5 * Math.sin(T * 6 + i * 2.1);
    star(cx + Math.cos(a) * rad * (0.85 + rnd(i) * 0.3), cy + Math.sin(a) * rad * 0.8, (10 + 12 * tw) * k, i % 3 ? '#fff6b0' : '#ffc1dc', T + i);
  }
}
function heart(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.beginPath();
  g.moveTo(0, 8); g.bezierCurveTo(-16, -6, -9, -20, 0, -11); g.bezierCurveTo(9, -20, 16, -6, 0, 8);
  g.fillStyle = col; g.fill(); g.restore();
}
function bow(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(-26, -16); g.lineTo(-26, 16); g.closePath(); fs(col, 3);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(26, -16); g.lineTo(26, 16); g.closePath(); fs(col, 3);
  g.beginPath(); g.moveTo(-4, 4); g.lineTo(-12, 28); g.moveTo(4, 4); g.lineTo(12, 28); ink(5); g.strokeStyle = col; g.stroke();
  ell(0, 0, 7, 7); fs(col, 3);
  g.restore();
}

// Product placeholder: pixel mosaic with a "광고" tag, like a blurred-out brand.
function adBox(x, y, w, h, T, label = 22) {
  const cell = Math.max(10, Math.round(w / 9)), k = Math.floor(T * 5);
  const pal = ['#ffc6d6', '#ffe9ef', '#f7a8c0', '#fff', '#e8d6ff', '#ffdbe6', '#d9c2f0'];
  g.save(); rr(x, y, w, h, 6); g.clip();
  for (let i = 0; i * cell < w; i++) for (let j = 0; j * cell < h; j++) {
    g.fillStyle = pal[Math.floor(rnd(i * 17 + j * 31 + k * 0.37) * pal.length)];
    g.fillRect(x + i * cell, y + j * cell, cell + 1, cell + 1);
  }
  g.restore();
  rr(x, y, w, h, 6); fs(null, 4);
  g.font = `${label}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const tw = g.measureText('광고').width + label;
  rr(x + w / 2 - tw / 2, y + h / 2 - label * 0.8, tw, label * 1.6, label * 0.4);
  g.fillStyle = 'rgba(30,20,20,.88)'; g.fill();
  g.fillStyle = '#fff'; g.fillText('광고', x + w / 2, y + h / 2 + 1);
}

// ---------- characters ----------
// Bean-bodied club girls: 루루 (pink twin tails, frills) and 쥬쥬 (black hime cut). Origin = body center, ~240 tall at s=1.
const GIRL = {
  ruru: { skin: '#fff1ec', outfit: '#ffb3cf', trim: '#fff', hair: '#ff8fc0', iris: '#c2407a', acc: '#1d1720' },
  juju: { skin: '#fbefea', outfit: '#2b2430', trim: '#f4f0f6', hair: '#1f1a24', iris: '#7a3a92', acc: '#ff6fa8' },
  saewoo: { skin: '#ffe9df', outfit: '#ffffff', trim: '#f1e6ff', hair: '#ff8a65', iris: '#c0582e', acc: '#f3c6d6' },
};
function shadowBlob(x, y, rx, hop = 0) {
  g.save(); g.translate(x, y); g.scale(1, 0.2);
  const r = rx * (1 - hop / 140), gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
  gr.addColorStop(0, 'rgba(20,0,20,.32)'); gr.addColorStop(1, 'rgba(20,0,20,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill(); g.restore();
}
function bodyPath() {
  g.beginPath(); g.moveTo(0, -120);
  g.bezierCurveTo(86, -120, 96, -40, 92, 30); g.bezierCurveTo(90, 106, 60, 122, 0, 122);
  g.bezierCurveTo(-60, 122, -90, 106, -92, 30); g.bezierCurveTo(-96, -40, -86, -120, 0, -120);
}
function girl(p) {
  const c = GIRL[p.who], t = p.t || 0, ph = (t / BEAT) * Math.PI;
  const hop = p.dance ? Math.abs(Math.sin(ph)) * 26 : p.hop ? Math.abs(Math.sin(t * 7)) * 20 : 0;
  const sway = p.dance ? Math.sin(ph * 0.5 + (p.who === 'juju' ? 1.5 : 0)) * 0.1 : (p.lean || 0);
  const sq = 1 + Math.sin(t * 3 + (p.who === 'juju' ? 1 : 0)) * 0.015;
  if (!p.noShadow) shadowBlob(p.x, p.y + 134 * p.s, 100 * p.s, hop);
  g.save(); g.translate(p.x, p.y - hop * p.s); g.rotate(sway); g.scale(p.s * (1 + 0.16 * (p.puffy || 0)), p.s * sq);
  // platform shoes
  rr(-60, 110, 46, 24, 8); fs(c.acc === '#1d1720' ? '#1d1720' : '#1d1720'); rr(14, 110, 46, 24, 8); fs('#1d1720');
  // back hair
  if (p.who === 'ruru') {
    for (const sd of [-1, 1]) {
      const sw = Math.sin(t * 4 + sd) * 8;
      g.beginPath(); g.moveTo(sd * 66, -96);
      g.bezierCurveTo(sd * 178, -96, sd * (182 + sw), 30, sd * (128 + sw), 120);
      g.bezierCurveTo(sd * (148 + sw), 40, sd * 124, -36, sd * 60, -62); g.closePath(); fs(c.hair);
      g.beginPath(); g.moveTo(sd * 120, -60); g.quadraticCurveTo(sd * 150, 0, sd * (136 + sw), 70); ink(2.5); g.stroke();
    }
  } else if (p.who === 'saewoo') {
    // veil
    g.save(); g.beginPath(); g.moveTo(-50, -126); g.bezierCurveTo(-210, -40, -200, 110, -160, 150); g.lineTo(160, 150); g.bezierCurveTo(200, 110, 210, -40, 50, -126); g.closePath();
    g.globalAlpha = 0.55; g.fillStyle = '#fff'; g.fill(); g.globalAlpha = 0.5; ink(2.5); g.stroke(); g.restore();
  } else {
    g.beginPath(); g.moveTo(-100, -40); g.bezierCurveTo(-112, -152, 112, -152, 100, -40);
    g.lineTo(110, 112); g.lineTo(-110, 112); g.closePath(); fs(c.hair);
  }
  bodyPath(); fs(c.skin);
  g.save(); bodyPath(); g.clip();
  g.fillStyle = c.outfit; g.fillRect(-120, 38, 240, 120);
  g.fillStyle = c.trim;
  if (p.who === 'ruru') {
    for (let x = -100; x <= 100; x += 20) { ell(x, 40, 10, 8); g.fill(); ell(x, 112, 10, 8); g.fill(); }
  } else if (p.who === 'juju') {
    ell(-24, 46, 24, 14, 0.3); g.fill(); ell(24, 46, 24, 14, -0.3); g.fill();
  } else {
    for (let x = -90; x <= 90; x += 30) { ell(x, 74, 5, 5); g.fill(); ell(x + 15, 100, 5, 5); g.fill(); }
  }
  if (p.melt) { g.fillStyle = `rgba(255,255,255,${0.12 * p.melt})`; g.fillRect(-120, -130, 240, 168); }
  g.restore();
  g.beginPath(); g.moveTo(-90, 38); g.quadraticCurveTo(0, 54, 90, 38); ink(3); g.stroke();
  bodyPath(); fs(null);
  bow(0, 58, 0.55, p.who === 'ruru' ? '#1d1720' : p.who === 'saewoo' ? '#f3a6c0' : '#ff6fa8');
  // arms
  const armR = p.armR || 0, armL = p.armL || 0;
  ell(lerp(96, 98, armR), lerp(64, -14, armR), 15, 28, lerp(-0.3, -2.6, armR)); fs(c.outfit);
  ell(lerp(-96, -98, armL), lerp(64, -14, armL), 15, 28, lerp(0.3, 2.6, armL)); fs(c.outfit);
  // front hair: scalloped hime bangs + tapered side locks
  const lock = p.who === 'juju' ? 40 : -14;
  g.beginPath(); g.moveTo(-96, lock); g.lineTo(-96, -20); g.bezierCurveTo(-104, -164, 104, -164, 96, -20); g.lineTo(96, lock);
  g.quadraticCurveTo(80, lock - 20, 78, -50);
  for (let i = 0; i <= 8; i++) { const x = 78 - i * 19.5; g.quadraticCurveTo(x - 10, -50, x - 19.5, -62 + (i % 2 ? 6 : 0)); }
  g.quadraticCurveTo(-80, lock - 20, -96, lock); g.closePath(); fs(c.hair);
  if (p.who === 'ruru') { bow(-74, -100, 0.75, '#1d1720'); bow(74, -100, 0.75, '#1d1720'); }
  else if (p.who === 'juju') { heart(58, -84, 1.1, '#ff6fa8'); }
  else {
    // 새우: bun, shrimp feelers, tiara
    ell(0, -146, 34, 26); fs(c.hair);
    for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(sd * 14, -166); g.bezierCurveTo(sd * 30, -230, sd * 90, -250, sd * 110, -210); ink(4); g.stroke(); }
    g.beginPath(); g.moveTo(-40, -112); g.lineTo(-26, -136); g.lineTo(-12, -118); g.lineTo(0, -144); g.lineTo(12, -118); g.lineTo(26, -136); g.lineTo(40, -112); g.closePath(); fs('#ffd84d', 3);
  }
  // face
  const fx = (p.lx || 0) * 7;
  g.fillStyle = 'rgba(255,140,170,.35)'; ell(-58 + fx, -4, 14, 8); g.fill(); ell(58 + fx, -4, 14, 8); g.fill();
  if (p.melt) {
    g.fillStyle = `rgba(30,18,34,${0.65 * p.melt})`; ell(-28 + fx, -34, 22, 24); g.fill(); ell(28 + fx, -34, 22, 24); g.fill();
  }
  const blink = ((t * 0.41 + (p.who === 'juju' ? 0.5 : 0)) % 1) < 0.03 && !p.noBlink;
  [-28, 28].forEach((ex, i) => {
    const sd = i ? 1 : -1;
    // 애교살: the red under-eye makeup
    g.fillStyle = 'rgba(255,70,105,.5)'; ell(ex + fx, -18, 16, 7); g.fill();
    if (p.puffy > 0.5) {
      g.fillStyle = 'rgba(90,60,140,.5)'; ell(ex + fx, -20, 20, 11); g.fill();
      line(ex + fx - 13, -34, ex + fx + 13, -34, 6);
      return;
    }
    const closed = p.happy || blink || (p.wink && i === 1);
    if (closed) {
      g.beginPath(); g.arc(ex + fx, -32, 11, p.happy || p.wink ? Math.PI * 1.1 : Math.PI * 0.1, p.happy || p.wink ? Math.PI * 1.9 : Math.PI * 0.9); ink(5); g.stroke();
    } else {
      ell(ex + fx, -36, 11, p.big ? 18 : 15); g.fillStyle = '#2a1a2e'; g.fill();
      ell(ex + fx, -32, 7, 9); g.fillStyle = c.iris; g.fill();
      ell(ex + fx - 3, -42, 3.6, 3.6); g.fillStyle = '#fff'; g.fill();
      ell(ex + fx + 3, -29, 1.8, 1.8); g.fill();
      g.beginPath(); g.arc(ex + fx, -36, 13, Math.PI * 1.08, Math.PI * 1.92); ink(4.5); g.stroke();
      if (p.who === 'juju') line(ex + fx + sd * 12, -44, ex + fx + sd * 22, -51, 4);
    }
    if (p.melt) {
      g.strokeStyle = '#21162a'; g.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        const len = p.melt * (40 + rnd(k * 5 + i) * 45), x = ex + fx - 7 + k * 7;
        g.lineWidth = 3.5; g.beginPath(); g.moveTo(x, -24); g.lineTo(x + Math.sin(k + t) * 2, -24 + len); g.stroke();
        ell(x, -24 + len, 3.5, 4.5); g.fillStyle = '#21162a'; g.fill();
      }
    }
  });
  if (p.angry) { line(-52, -66, -14, -52, 6); line(52, -66, 14, -52, 6); }
  if (p.melt > 0.6) { g.globalAlpha = (p.melt - 0.6) / 0.4; g.fillStyle = c.skin; g.fillRect(-48, -60, 96, 10); g.globalAlpha = 1; }
  const open = p.talk ? 0.3 + 0.7 * Math.abs(Math.sin(t * 16 + Math.sin(t * 5))) : 0;
  if (open > 0.05) {
    ell(fx, -4, 9, 3 + 8 * open); fs(p.lips ? '#7a0f24' : '#c2455a', 3);
    if (p.lips) { ell(fx, -4, 12, 5 + 8 * open); g.strokeStyle = '#e0123c'; g.lineWidth = 4; g.stroke(); }
  } else if (p.lips) {
    g.beginPath(); g.moveTo(fx - 13, -8); g.quadraticCurveTo(fx - 7, -16, fx, -10); g.quadraticCurveTo(fx + 7, -16, fx + 13, -8); g.quadraticCurveTo(fx, 5, fx - 13, -8);
    fs('#e0123c', 3); ell(fx - 4, -10, 3, 1.6); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
  } else if (p.smirk) { g.beginPath(); g.moveTo(fx - 9, -6); g.quadraticCurveTo(fx + 2, -2, fx + 11, -11); ink(4); g.stroke(); }
  else if (p.shock) { ell(fx, -2, 8, 10); fs('#c2455a', 3); }
  else if (p.angry) { g.beginPath(); g.arc(fx, 2, 10, Math.PI * 1.15, Math.PI * 1.85); ink(4.5); g.stroke(); }
  else { g.beginPath(); g.arc(fx, -10, 8, 0.2, Math.PI - 0.2); ink(4); g.stroke(); }
  if (p.sweat) for (let i = 0; i < p.sweat; i++) {
    const sd = i % 2 ? -1 : 1, y = -60 + ((t * 0.8 + i * 0.4) % 1) * 60;
    g.beginPath(); g.moveTo(sd * 96, y - 16); g.quadraticCurveTo(sd * 96 + 10, y + 2, sd * 96, y + 8); g.quadraticCurveTo(sd * 96 - 10, y + 2, sd * 96, y - 16); fs('#9fd8ff', 3);
  }
  if (p.glow) {
    g.globalAlpha = p.glow * 0.85; g.fillStyle = '#fff';
    ell(-40, -66, 14, 5, -0.4); g.fill(); ell(58, -4, 6, 3.5, -0.4); g.fill();
    g.globalAlpha = 1;
  }
  g.restore();
  return { x: p.x, y: p.y - (140 + hop) * p.s };
}

// 오징어 단역
function squid(p) {
  const t = p.t || 0;
  shadowBlob(p.x, p.y + 122 * p.s, 64 * p.s);
  g.save(); g.translate(p.x, p.y); g.scale(p.s, p.s);
  for (let i = 0; i < 5; i++) {
    const x = -36 + i * 18; g.beginPath(); g.moveTo(x, 40);
    g.quadraticCurveTo(x + Math.sin(t * 6 + i) * 14, 80, x + Math.sin(t * 6 + i + 1) * 10, 118);
    ink(14); g.stroke(); g.strokeStyle = '#f6e3dc'; g.lineWidth = 8; g.stroke();
  }
  g.beginPath(); g.moveTo(-58, -20); g.lineTo(0, -132); g.lineTo(58, -20); g.closePath(); fs('#f6e3dc');
  ell(0, 6, 52, 58); fs('#f6e3dc');
  if (p.tux) {
    g.save(); ell(0, 6, 52, 58); g.clip();
    g.fillStyle = '#1c1a24'; g.fillRect(-60, 42, 120, 40);
    g.beginPath(); g.moveTo(-14, 42); g.lineTo(0, 66); g.lineTo(14, 42); g.closePath(); g.fillStyle = '#fff'; g.fill();
    g.restore(); ell(0, 6, 52, 58); fs(null); bow(0, 46, 0.32, '#1c1a24');
  }
  ell(-17, -2, 6, 8); g.fillStyle = OUT; g.fill(); ell(17, -2, 6, 8); g.fill();
  const open = p.talk ? 0.3 + 0.7 * Math.abs(Math.sin(t * 16)) : 0;
  if (open > 0.05) { ell(0, 24, 6, 2 + 6 * open); fs('#c2455a', 3); }
  else if (p.dumb) { ell(0, 26, 8, 11); fs('#7a2a3a', 3); }
  else { g.beginPath(); g.arc(0, 32, 8, Math.PI * 1.15, Math.PI * 1.85); ink(3); g.stroke(); }
  if (p.sweat) { ell(56, -40 + ((t * 50) % 40), 6, 9); fs('#9fd8ff', 3); }
  if (p.cry) { g.fillStyle = '#9fd8ff'; for (const sd of [-1, 1]) { g.fillRect(sd * 17 - 3, 6, 6, 16 + ((t * 40) % 20)); } }
  ell(-54, 0, 9, 9); g.fillStyle = 'rgba(255,140,170,.4)'; g.fill();
  g.restore();
  return { x: p.x, y: p.y - 140 * p.s };
}

function kissMark(x, y, s, rot = 0, col = '#e0123c') {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.moveTo(-16, 0); g.quadraticCurveTo(-10, -12, 0, -5); g.quadraticCurveTo(10, -12, 16, 0); g.quadraticCurveTo(0, -2, -16, 0); g.fill();
  g.beginPath(); g.moveTo(-16, 3); g.quadraticCurveTo(0, 5, 16, 3); g.quadraticCurveTo(0, 17, -16, 3); g.fill();
  g.restore();
}

// 훈남 문어: white shirt so the collar can show (or not show) lip marks
const MARKS = [[-30, -70, 0.9, -0.3], [34, -20, 1, 0.4], [-40, -10, 0.8, 0.2], [10, -88, 0.8, 0.1], [44, -64, 0.7, -0.5], [-14, 8, 0.7, 0.3], [-26, 46, 0.8, -0.2], [24, 50, 0.7, 0.3]];
function octo(p) {
  const t = p.t || 0;
  g.save(); g.translate(p.x, p.y); g.scale(p.s, p.s);
  for (let i = 0; i < 6; i++) {
    const x = -50 + i * 20; g.beginPath(); g.moveTo(x, 80);

// Lighting helpers: additive bokeh, light shafts. Colors are 'rgba(r,g,b,A)' templates.
function bokeh(n, seed, cols, T, y0 = 0, y1 = H, rmax = 40, a = 0.35) {
  g.save(); g.globalCompositeOperation = 'lighter';

    const r = rmax * (0.4 + rnd(seed + i * 1.3) * 0.6), tw = 0.7 + 0.3 * Math.sin(T * 2 + i), c = cols[i % cols.length];
    const gr = g.createRadialGradient(x, y, 0, x, y, r);

  }
  g.restore();
}

function babblePlan(text, d) {
  const toks = Array.from(text).map(c => (/[가-힣]/.test(c) ? c : /[\s,…~.]/.test(c) ? ' ' : null)).filter(Boolean);
  const units = toks.reduce((n, c) => n + (c === ' ' ? 0.6 : 1), 0);
  const step = Math.min(0.115, (d - 0.15) / Math.max(units, 1));
  let at = 0; const syl = [];
  for (const c of toks) { if (c === ' ') at += step * 0.6; else { syl.push({ c, at }); at += step; } }
  return { syl, step, dur: at };
}

    const a = anchors[l.who], k = Math.min(backOut((T - l.t0) / 0.2), clamp((l.t1 - T) / 0.1, 0, 1));
    speechBubble(l.text, cx + (a.x - cx) * z, cy + (a.y - cy) * z, l.side, k);
  }
  g.font = `22px ${FONT}`; rr(18, 16, 64, 34, 8); g.fillStyle = 'rgba(30,20,20,.75)'; g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('광고', 50, 34);
}

// ---------- audio ----------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function noiseBuf(ac) {
  if (ac._noise) return ac._noise;
  const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return (ac._noise = b);
}
function env(ac, out, t, a, hold, rel, peak) {
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t + a);
  gn.gain.setValueAtTime(peak, t + a + hold); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
  gn.connect(out); return gn;
}
function tone(ac, out, t, type, f0, f1, dur, peak) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(env(ac, out, t, 0.008, dur * 0.4, dur * 0.6, peak)); o.start(t); o.stop(t + dur + 0.05);
}
function noise(ac, out, t, dur, ftype, freq, q, peak, a = 0.01) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf(ac); s.loop = true;
  const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(env(ac, out, t, a, dur * 0.5, dur * 0.5, peak)); s.start(t); s.stop(t + dur + 0.05);
  return f;
}

const PITCH = { r: 480, j: 330, s: 230, o: 270, g: 300, b: 430 };
const SYNTH = {
  babble(ac, out, t, e) {
    // vowel formants (F1, F2) by Hangul medial vowel; sawtooth through two band-passes reads as a cute "voice"
    const F = { a: [850, 1300], e: [520, 1900], eo: [620, 1050], o: [460, 820], u: [350, 900], eu: [400, 1450], i: [320, 2300] };
    const MED = ['a', 'e', 'a', 'e', 'eo', 'e', 'eo', 'e', 'o', 'a', 'e', 'e', 'o', 'u', 'eo', 'e', 'i', 'u', 'eu', 'i', 'i'];
    const base = PITCH[e.who], end = /[?]/.test(e.text) ? 1.35 : /!/.test(e.text) ? 1.15 : /[…~]/.test(e.text) ? 0.85 : 1;
    const { syl, step } = babblePlan(e.text, e.d);
    syl.forEach(({ c, at }, i) => {
      const code = c.charCodeAt(0) - 0xac00, [f1, f2] = F[MED[Math.floor((code % 588) / 28)]];
      const last = i === syl.length - 1, p = base * (1 + 0.1 * Math.sin(i * 1.9) + (rnd(code) - 0.5) * 0.12) * (last ? end : 1);
      const st = t + at, dur = step * 0.92;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(p * (last && end > 1 ? 0.92 : 1.05), st); o.frequency.linearRampToValueAtTime(p * (last && end > 1 ? 1.08 : 0.95), st + dur);
      const amp = env(ac, out, st, 0.012, dur * 0.45, dur * 0.5, 0.55);
      for (const [f, q, gn] of [[f1 * 1.15, 6, 1], [f2 * 1.15, 9, 0.5]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        const gg = ac.createGain(); gg.gain.value = gn; o.connect(bp); bp.connect(gg); gg.connect(amp);
      }
      o.start(st); o.stop(st + dur + 0.05);
      tone(ac, out, st, 'sine', p, p * 0.97, dur, 0.07);
      if (code % 28) tone(ac, out, st + dur * 0.55, 'sine', p * 0.9, p * 0.85, dur * 0.4, 0.06); // 받침: soft hum ("옹")
    });
  },
  pop(ac, out, t) { tone(ac, out, t, 'sine', 400, 1000, 0.12, 0.35); },
  ding(ac, out, t) { tone(ac, out, t, 'sine', 1568, 1568, 1.0, 0.22); tone(ac, out, t, 'sine', 2349, 2349, 0.8, 0.1); },
  sparkle(ac, out, t) { [76, 81, 84, 88, 91, 96].forEach((m, i) => tone(ac, out, t + i * 0.06, 'sine', mtof(m), mtof(m), 0.35, 0.09)); },
  whoosh(ac, out, t) { const f = noise(ac, out, t, 0.5, 'bandpass', 600, 1.2, 0.35, 0.15); f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.5); },
  pat(ac, out, t) { noise(ac, out, t, 0.07, 'lowpass', 900, 1, 0.7, 0.002); tone(ac, out, t, 'sine', 220, 110, 0.07, 0.4); },
  gasp(ac, out, t) {
    const f = noise(ac, out, t, 0.9, 'bandpass', 900, 2.5, 0.45, 0.25); f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(1300, t + 0.5);
    [300, 360, 420].forEach((fr, i) => tone(ac, out, t + i * 0.04, 'triangle', fr, fr * 1.3, 0.6, 0.05));
  },
  shutter(ac, out, t) { noise(ac, out, t, 0.03, 'highpass', 3000, 1, 0.6, 0.001); noise(ac, out, t + 0.07, 0.03, 'highpass', 2500, 1, 0.5, 0.001); tone(ac, out, t, 'sine', 2400, 5200, 0.3, 0.03); },
  clink(ac, out, t) { tone(ac, out, t, 'sine', 2637, 2637, 0.5, 0.18); tone(ac, out, t, 'sine', 3520, 3520, 0.35, 0.1); },
  bustle(ac, out, t, e) {
    noise(ac, out, t, e.d, 'bandpass', 500, 0.7, 0.12, 0.4);
    for (let i = 0; i < 6; i++) tone(ac, out, t + rnd(i * 3.7) * e.d, 'sine', 2900 + rnd(i) * 600, 2900, 0.15, 0.04);
  },
  march(ac, out, t, e) {
    // Bridal Chorus on a soft organ
    const beat = 0.5, mel = [[60, 1], [65, .75], [65, .25], [65, 2], [60, 1], [67, .75], [64, .25], [65, 2], [60, 1], [65, .75], [69, .25], [72, 1.5], [69, .5], [65, 1], [62, .75], [65, .25], [67, 2]];
    let at = 0;
    while (at < e.d) for (const [m, b] of mel) {
      if (at >= e.d) break;
      const nt = t + at, dur = b * beat * 0.95, fade = clamp((e.d - at) / 1.2, 0, 1);
      if (nt >= ac.currentTime + 0.02) {
        tone(ac, out, nt, 'triangle', mtof(m), mtof(m), dur, 0.08 * fade); tone(ac, out, nt, 'sine', mtof(m + 12), mtof(m + 12), dur, 0.03 * fade);
        if (b >= 1) tone(ac, out, nt, 'triangle', mtof(m - 12), mtof(m - 12), dur, 0.05 * fade);
      }
      at += b * beat;
    }
  },
  doom(ac, out, t) { tone(ac, out, t, 'sine', 110, 50, 0.45, 0.8); tone(ac, out, t + 0.35, 'sine', 100, 45, 0.6, 0.8); noise(ac, out, t + 0.35, 0.3, 'lowpass', 200, 1, 0.4); },
  stamp(ac, out, t) { noise(ac, out, t, 0.12, 'lowpass', 500, 1, 0.8, 0.002); tone(ac, out, t, 'sine', 90, 50, 0.15, 0.6); },
  kiss(ac, out, t) { tone(ac, out, t, 'sine', 500, 1500, 0.1, 0.25); tone(ac, out, t + 0.1, 'sine', 1400, 300, 0.07, 0.3); },
  slam(ac, out, t) { noise(ac, out, t, 0.35, 'lowpass', 300, 1, 1.0, 0.002); tone(ac, out, t, 'sine', 80, 40, 0.3, 0.8); },
  drip(ac, out, t) { for (let i = 0; i < 3; i++) tone(ac, out, t + i * 0.32, 'sine', 900 - i * 120, 260, 0.28, 0.22); },
  birds(ac, out, t, e) { for (let i = 0; i < 9; i++) { const st = t + rnd(i * 9) * e.d; tone(ac, out, st, 'sine', 2600, 3600, 0.06, 0.08); tone(ac, out, st + 0.09, 'sine', 2800, 3900, 0.05, 0.07); } },
  club(ac, out, t, e) {
    // four-on-the-floor house loop; 'muf' = heard through the bathroom wall
    const muf = e.arg === 'muf';
    let dest = out;
    if (muf) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280; lp.connect(out); dest = lp; }
    const bass = [36, 36, 39, 41];
    for (let i = 0; i * BEAT / 2 < e.d; i++) {
      const nt = t + (i * BEAT) / 2;
      if (nt < ac.currentTime + 0.02) continue;
      const bar = Math.floor(i / 8) % 4;
      if (i % 2 === 0) tone(ac, dest, nt, 'sine', 150, 45, 0.22, muf ? 0.9 : 0.75);
      if (!muf && i % 2 === 1) noise(ac, dest, nt, 0.05, 'highpass', 8000, 1, 0.12, 0.002);
      if (i % 2 === 1) tone(ac, dest, nt, 'sawtooth', mtof(bass[bar]), mtof(bass[bar]), BEAT * 0.4, muf ? 0.12 : 0.07);
      if (!muf && i % 8 === 3) [60, 63, 67].forEach(n => tone(ac, dest, nt, 'square', mtof(n + bass[bar] - 36), mtof(n + bass[bar] - 36), 0.12, 0.025));
    }
  },
};

function schedule(ac, out, base, from) {
  for (const e of EVENTS) {
    if (!SYNTH[e.type]) continue;
    if (['club', 'march', 'bustle'].includes(e.type) ? e.t + e.d < from : e.t < from) continue;
    SYNTH[e.type](ac, out, base + e.t, e);
  }
}
function master(ac) {
  const comp = ac.createDynamicsCompressor(), gn = ac.createGain();
  gn.gain.value = 0.9; gn.connect(comp); comp.connect(ac.destination); return gn;
}

window.renderAudioWav = async () => {
  const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  schedule(oac, master(oac), 0, 0);
  const buf = await oac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true);
  out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true);
  out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
    out.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.drawFrame = drawFrame;
window.DUR = DUR;

// ---------- player ----------
const btn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time'), sndBtn = document.getElementById('snd');
let playing = false, cur = 0, startPerf = 0, ac = null, muted = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function stopAudio() { if (ac) { ac.close(); ac = null; } }
function startAudio() {
  stopAudio();
  if (muted) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  schedule(ac, master(ac), ac.currentTime + 0.05 - cur, cur);
}
function play() {
  if (cur >= DUR - 0.05) cur = 0;
  playing = true; startPerf = performance.now() - cur * 1000; btn.textContent = '⏸ 정지';
  startAudio(); requestAnimationFrame(tick);
}
function pause() { playing = false; btn.textContent = '▶ 재생'; stopAudio(); }
function render() { drawFrame(cur); seek.value = Math.round((cur / DUR) * 1000); timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`; }
function tick() {
  if (!playing) return;
  cur = (performance.now() - startPerf) / 1000;
  if (cur >= DUR) { cur = DUR; pause(); }
  render();
  if (playing) requestAnimationFrame(tick);
}
btn.onclick = () => (playing ? pause() : play());
cv.onclick = () => (playing ? pause() : play());
seek.oninput = () => { cur = (seek.value / 1000) * DUR; if (playing) { startPerf = performance.now() - cur * 1000; startAudio(); } render(); };
sndBtn.onclick = () => { muted = !muted; sndBtn.textContent = muted ? '🔇' : '🔊'; if (playing) startAudio(); };

// Korean webfonts arrive in unicode-range subsets, so preload every string the film draws.
const ALL_TEXT = LINES.map(l => l.text).join('') + '광고하객룩끝판왕쿠션퉁퉁3초커버·붓기실종하루종일광채퍽나이스캐치플래시받아도안뜸남의결혼식에서도,주인공은나지금1+1프로필링크클릭청첩장WeddingRECISO소주닭발♡';
window.ready = Promise.all([document.fonts.load(`40px 'Jua'`, ALL_TEXT)]).catch(() => {}).then(() => {
  cur = 10.5; render(); cur = 0;
  timeEl.textContent = `${fmt(0)} / ${fmt(DUR)}`; seek.value = 0;
});
</script>
