<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>클럽 가기 전에</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 30s vertical (9:16) B-grade cartoon ad: two club girls, speech-bubble dialogue with babble voices, product hidden behind an "광고" mosaic. */
:root{color-scheme:dark;--bg:#0e0e10;--panel:#18181c;--fg:#f1f1f1;--muted:#9a9aa3;--accent:#ff6fa8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Jua',system-ui,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:16px}
h1{font-weight:400;font-size:22px;margin:4px 0 12px}
h1 span{color:var(--accent)}
canvas{width:100%;max-width:420px;margin:0 auto;aspect-ratio:9/16;display:block;background:#000;border-radius:12px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;font-size:16px;background:var(--panel);color:var(--fg);border:1px solid #2c2c33;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a4a55}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:84px;text-align:right}
p.note{color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>스캘프 랩 애니 <span>클럽 가기 전에 (9:16 · 30초)</span></h1>
  <canvas id="cv"></canvas>
  <div class="bar">
    <button id="play">▶ 재생</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="snd">🔊</button>
  </div>
  <p class="note">화면을 눌러도 재생/정지돼요. 대사는 말풍선, 목소리는 옹알옹알 효과음이에요. 소리는 전부 브라우저에서 합성됩니다.</p>
</div>
<script>
const W = 720, H = 1280;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

const OUT = '#2a1a26';
const FONT = "'Jua',sans-serif";
const BPM = 124, BEAT = 60 / BPM;

// ---------- math ----------
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const backOut = t => { t = clamp(t, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---------- primitives ----------
function ink(lw = 4) { g.strokeStyle = OUT; g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; }
function fs(fill, lw = 4) { if (fill) { g.fillStyle = fill; g.fill(); } ink(lw); g.stroke(); }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), rot, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function line(x1, y1, x2, y2, lw = 4) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); ink(lw); g.stroke(); }

function popText(txt, x, y, size, fill, rot = 0, sc = 1) {
  if (sc <= 0) return;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc, sc);
  g.font = `${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = size * 0.22; g.strokeStyle = OUT; g.strokeText(txt, 0, 0);
  g.lineWidth = size * 0.11; g.strokeStyle = '#fff'; g.strokeText(txt, 0, 0);
  g.fillStyle = fill; g.fillText(txt, 0, 0);
  g.restore();
}

function star(x, y, r, col = '#fff6b0', rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rad = i % 2 ? r * 0.32 : r; g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  g.closePath(); fs(col, 3); g.restore();
}
function sparkles(cx, cy, rad, n, T, k = 1) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + T * 0.6, tw = 0.5 + 0.5 * Math.sin(T * 6 + i * 2.1);
    star(cx + Math.cos(a) * rad * (0.85 + rnd(i) * 0.3), cy + Math.sin(a) * rad * 0.8, (10 + 12 * tw) * k, i % 3 ? '#fff6b0' : '#ffc1dc', T + i);
  }
}
function heart(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.beginPath();
  g.moveTo(0, 8); g.bezierCurveTo(-16, -6, -9, -20, 0, -11); g.bezierCurveTo(9, -20, 16, -6, 0, 8);
  g.fillStyle = col; g.fill(); g.restore();
}
function bow(x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(-26, -16); g.lineTo(-26, 16); g.closePath(); fs(col, 3);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(26, -16); g.lineTo(26, 16); g.closePath(); fs(col, 3);
  g.beginPath(); g.moveTo(-4, 4); g.lineTo(-12, 28); g.moveTo(4, 4); g.lineTo(12, 28); ink(5); g.strokeStyle = col; g.stroke();
  ell(0, 0, 7, 7); fs(col, 3);
  g.restore();
}

// Product placeholder: pixel mosaic with a "광고" tag, like a blurred-out brand.
function adBox(x, y, w, h, T, label = 22) {
  const cell = Math.max(10, Math.round(w / 9)), k = Math.floor(T * 5);
  const pal = ['#ffc6d6', '#ffe9ef', '#f7a8c0', '#fff', '#e8d6ff', '#ffdbe6', '#d9c2f0'];
  g.save(); rr(x, y, w, h, 6); g.clip();
  for (let i = 0; i * cell < w; i++) for (let j = 0; j * cell < h; j++) {
    g.fillStyle = pal[Math.floor(rnd(i * 17 + j * 31 + k * 0.37) * pal.length)];
    g.fillRect(x + i * cell, y + j * cell, cell + 1, cell + 1);
  }
  g.restore();
  rr(x, y, w, h, 6); fs(null, 4);
  g.font = `${label}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const tw = g.measureText('광고').width + label;
  rr(x + w / 2 - tw / 2, y + h / 2 - label * 0.8, tw, label * 1.6, label * 0.4);
  g.fillStyle = 'rgba(30,20,20,.88)'; g.fill();
  g.fillStyle = '#fff'; g.fillText('광고', x + w / 2, y + h / 2 + 1);
}

// ---------- characters ----------
// Bean-bodied club girls: 루루 (pink twin tails, frills) and 쥬쥬 (black hime cut). Origin = body center, ~240 tall at s=1.
const GIRL = {
  ruru: { skin: '#fff1ec', outfit: '#ffb3cf', trim: '#fff', hair: '#ff8fc0', iris: '#c2407a', acc: '#1d1720' },
  juju: { skin: '#fbefea', outfit: '#2b2430', trim: '#f4f0f6', hair: '#1f1a24', iris: '#7a3a92', acc: '#ff6fa8' },
};
function bodyPath() {
  g.beginPath(); g.moveTo(0, -120);
  g.bezierCurveTo(86, -120, 96, -40, 92, 30); g.bezierCurveTo(90, 106, 60, 122, 0, 122);
  g.bezierCurveTo(-60, 122, -90, 106, -92, 30); g.bezierCurveTo(-96, -40, -86, -120, 0, -120);
}
function girl(p) {
  const c = GIRL[p.who], t = p.t || 0, ph = (t / BEAT) * Math.PI;
  const hop = p.dance ? Math.abs(Math.sin(ph)) * 26 : p.hop ? Math.abs(Math.sin(t * 7)) * 20 : 0;
  const sway = p.dance ? Math.sin(ph * 0.5 + (p.who === 'juju' ? 1.5 : 0)) * 0.1 : (p.lean || 0);
  const sq = 1 + Math.sin(t * 3 + (p.who === 'juju' ? 1 : 0)) * 0.015;
  g.save(); g.translate(p.x, p.y - hop * p.s); g.rotate(sway); g.scale(p.s, p.s * sq);
  // platform shoes
  rr(-60, 110, 46, 24, 8); fs(c.acc === '#1d1720' ? '#1d1720' : '#1d1720'); rr(14, 110, 46, 24, 8); fs('#1d1720');
  // back hair
  if (p.who === 'ruru') {
    for (const sd of [-1, 1]) {
      const sw = Math.sin(t * 4 + sd) * 8;
      g.beginPath(); g.moveTo(sd * 66, -96);
      g.bezierCurveTo(sd * 178, -96, sd * (182 + sw), 30, sd * (128 + sw), 120);
      g.bezierCurveTo(sd * (148 + sw), 40, sd * 124, -36, sd * 60, -62); g.closePath(); fs(c.hair);
      g.beginPath(); g.moveTo(sd * 120, -60); g.quadraticCurveTo(sd * 150, 0, sd * (136 + sw), 70); ink(2.5); g.stroke();
    }
  } else {
    g.beginPath(); g.moveTo(-100, -40); g.bezierCurveTo(-112, -152, 112, -152, 100, -40);
    g.lineTo(110, 112); g.lineTo(-110, 112); g.closePath(); fs(c.hair);
  }
  bodyPath(); fs(c.skin);
  g.save(); bodyPath(); g.clip();
  g.fillStyle = c.outfit; g.fillRect(-120, 38, 240, 120);
  g.fillStyle = c.trim;
  if (p.who === 'ruru') {
    for (let x = -100; x <= 100; x += 20) { ell(x, 40, 10, 8); g.fill(); ell(x, 112, 10, 8); g.fill(); }
  } else {
    ell(-24, 46, 24, 14, 0.3); g.fill(); ell(24, 46, 24, 14, -0.3); g.fill();
  }
  if (p.melt) { g.fillStyle = `rgba(255,255,255,${0.12 * p.melt})`; g.fillRect(-120, -130, 240, 168); }
  g.restore();
  g.beginPath(); g.moveTo(-90, 38); g.quadraticCurveTo(0, 54, 90, 38); ink(3); g.stroke();
  bodyPath(); fs(null);
  bow(0, 58, 0.55, p.who === 'ruru' ? '#1d1720' : '#ff6fa8');
  // arms
  const armR = p.armR || 0, armL = p.armL || 0;
  ell(lerp(96, 98, armR), lerp(64, -14, armR), 15, 28, lerp(-0.3, -2.6, armR)); fs(c.outfit);
  ell(lerp(-96, -98, armL), lerp(64, -14, armL), 15, 28, lerp(0.3, 2.6, armL)); fs(c.outfit);
  // front hair: scalloped hime bangs + tapered side locks
  const lock = p.who === 'juju' ? 40 : -14;
  g.beginPath(); g.moveTo(-96, lock); g.lineTo(-96, -20); g.bezierCurveTo(-104, -164, 104, -164, 96, -20); g.lineTo(96, lock);
  g.quadraticCurveTo(80, lock - 20, 78, -50);
  for (let i = 0; i <= 8; i++) { const x = 78 - i * 19.5; g.quadraticCurveTo(x - 10, -50, x - 19.5, -62 + (i % 2 ? 6 : 0)); }
  g.quadraticCurveTo(-80, lock - 20, -96, lock); g.closePath(); fs(c.hair);
  if (p.who === 'ruru') { bow(-74, -100, 0.75, '#1d1720'); bow(74, -100, 0.75, '#1d1720'); }
  else { heart(58, -84, 1.1, '#ff6fa8'); }
  // face
  const fx = (p.lx || 0) * 7;
  g.fillStyle = 'rgba(255,140,170,.35)'; ell(-58 + fx, -4, 14, 8); g.fill(); ell(58 + fx, -4, 14, 8); g.fill();
  if (p.melt) {
    g.fillStyle = `rgba(30,18,34,${0.65 * p.melt})`; ell(-28 + fx, -34, 22, 24); g.fill(); ell(28 + fx, -34, 22, 24); g.fill();
  }
  const blink = ((t * 0.41 + (p.who === 'juju' ? 0.5 : 0)) % 1) < 0.03 && !p.noBlink;
  [-28, 28].forEach((ex, i) => {
    const sd = i ? 1 : -1;
    // 애교살: the red under-eye makeup
    g.fillStyle = 'rgba(255,70,105,.5)'; ell(ex + fx, -18, 16, 7); g.fill();
    const closed = p.happy || blink || (p.wink && i === 1);
    if (closed) {
      g.beginPath(); g.arc(ex + fx, -32, 11, p.happy || p.wink ? Math.PI * 1.1 : Math.PI * 0.1, p.happy || p.wink ? Math.PI * 1.9 : Math.PI * 0.9); ink(5); g.stroke();
    } else {
      ell(ex + fx, -36, 11, p.big ? 18 : 15); g.fillStyle = '#2a1a2e'; g.fill();
      ell(ex + fx, -32, 7, 9); g.fillStyle = c.iris; g.fill();
      ell(ex + fx - 3, -42, 3.6, 3.6); g.fillStyle = '#fff'; g.fill();
      ell(ex + fx + 3, -29, 1.8, 1.8); g.fill();
      g.beginPath(); g.arc(ex + fx, -36, 13, Math.PI * 1.08, Math.PI * 1.92); ink(4.5); g.stroke();
      if (p.who === 'juju') line(ex + fx + sd * 12, -44, ex + fx + sd * 22, -51, 4);
    }
    if (p.melt) {
      g.strokeStyle = '#21162a'; g.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        const len = p.melt * (40 + rnd(k * 5 + i) * 45), x = ex + fx - 7 + k * 7;
        g.lineWidth = 3.5; g.beginPath(); g.moveTo(x, -24); g.lineTo(x + Math.sin(k + t) * 2, -24 + len); g.stroke();
        ell(x, -24 + len, 3.5, 4.5); g.fillStyle = '#21162a'; g.fill();
      }
    }
  });
  if (p.melt > 0.6) { g.globalAlpha = (p.melt - 0.6) / 0.4; g.fillStyle = c.skin; g.fillRect(-48, -60, 96, 10); g.globalAlpha = 1; }
  const open = p.talk ? 0.3 + 0.7 * Math.abs(Math.sin(t * 16 + Math.sin(t * 5))) : 0;
  if (open > 0.05) { ell(fx, -4, 9, 3 + 8 * open); fs('#c2455a', 3); }
  else if (p.smirk) { g.beginPath(); g.moveTo(fx - 9, -6); g.quadraticCurveTo(fx + 2, -2, fx + 11, -11); ink(4); g.stroke(); }
  else if (p.shock) { ell(fx, -2, 8, 10); fs('#c2455a', 3); }
  else { g.beginPath(); g.arc(fx, -10, 8, 0.2, Math.PI - 0.2); ink(4); g.stroke(); }
  if (p.sweat) for (let i = 0; i < p.sweat; i++) {
    const sd = i % 2 ? -1 : 1, y = -60 + ((t * 0.8 + i * 0.4) % 1) * 60;
    g.beginPath(); g.moveTo(sd * 96, y - 16); g.quadraticCurveTo(sd * 96 + 10, y + 2, sd * 96, y + 8); g.quadraticCurveTo(sd * 96 - 10, y + 2, sd * 96, y - 16); fs('#9fd8ff', 3);
  }
  if (p.glow) {
    g.globalAlpha = p.glow * 0.85; g.fillStyle = '#fff';
    ell(-40, -66, 14, 5, -0.4); g.fill(); ell(58, -4, 6, 3.5, -0.4); g.fill();
    g.globalAlpha = 1;
  }
  g.restore();
  return { x: p.x, y: p.y - (140 + hop) * p.s };
}

// 오징어 단역
function squid(p) {
  const t = p.t || 0;
  g.save(); g.translate(p.x, p.y); g.scale(p.s, p.s);
  for (let i = 0; i < 5; i++) {
    const x = -36 + i * 18; g.beginPath(); g.moveTo(x, 40);
    g.quadraticCurveTo(x + Math.sin(t * 6 + i) * 14, 80, x + Math.sin(t * 6 + i + 1) * 10, 118);
    ink(14); g.stroke(); g.strokeStyle = '#f6e3dc'; g.lineWidth = 8; g.stroke();
  }
  g.beginPath(); g.moveTo(-58, -20); g.lineTo(0, -132); g.lineTo(58, -20); g.closePath(); fs('#f6e3dc');
  ell(0, 6, 52, 58); fs('#f6e3dc');
  ell(-17, -2, 6, 8); g.fillStyle = OUT; g.fill(); ell(17, -2, 6, 8); g.fill();
  const open = p.talk ? 0.3 + 0.7 * Math.abs(Math.sin(t * 16)) : 0;
  if (open > 0.05) { ell(0, 24, 6, 2 + 6 * open); fs('#c2455a', 3); }
  else { g.beginPath(); g.arc(0, 32, 8, Math.PI * 1.15, Math.PI * 1.85); ink(3); g.stroke(); }
  if (p.cry) { g.fillStyle = '#9fd8ff'; for (const sd of [-1, 1]) { g.fillRect(sd * 17 - 3, 6, 6, 16 + ((t * 40) % 20)); } }
  ell(-54, 0, 9, 9); g.fillStyle = 'rgba(255,140,170,.4)'; g.fill();
  g.restore();
  return { x: p.x, y: p.y - 140 * p.s };
}

// ---------- sets ----------
function girlyRoom() {
  g.fillStyle = '#ffd3e6'; g.fillRect(-300, -300, 1400, 1300);
  for (let r = 0; r < 20; r++) for (let c = -2; c < 12; c++) heart(c * 80 + (r % 2) * 40, r * 70, 0.7, r % 2 ? '#ffb8d6' : '#2a1a26');
  g.fillStyle = '#3a2232'; g.fillRect(-300, 980, 1400, 600);
  for (let i = 0; i < 12; i++) for (let j = 0; j < 6; j++) if ((i + j) % 2) { g.fillStyle = '#ff9cc6'; g.fillRect(i * 64, 980 + j * 52, 64, 52); }
  line(-300, 980, 1100, 980, 4);
  // plushie bunny + neon sign
  ell(640, 930, 48, 50); fs('#fff'); ell(622, 862, 12, 34, -0.2); fs('#fff'); ell(658, 862, 12, 34, 0.2); fs('#fff');
  ell(628, 924, 4, 6); g.fillStyle = OUT; g.fill(); ell(652, 924, 4, 6); g.fill(); line(616, 948, 662, 948, 3);
  g.save(); g.shadowColor = '#ff4fa0'; g.shadowBlur = 24; g.font = `56px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#ffe0ef';
  g.fillText('LOVE♡', 360, 300); g.restore();
}

function vanityFrame(T) {
  const x = 60, y = 230, w = 600, h = 860;
  g.save();
  g.beginPath(); g.rect(0, 0, W, H); g.roundRect(x, y, w, h, 40);
  g.fillStyle = '#ffe9f2'; g.fill('evenodd');
  rr(x, y, w, h, 40); g.lineWidth = 26; g.strokeStyle = '#f7c4dc'; g.stroke();
  rr(x - 13, y - 13, w + 26, h + 26, 52); ink(4); g.stroke(); rr(x + 13, y + 13, w - 26, h - 26, 28); ink(4); g.stroke();
  for (let i = 0; i < 7; i++) {
    for (const [bx, by] of [[x + 30 + i * 90, y - 50], [x + 30 + i * 90, y + h + 50]]) { ell(bx, by, 20, 20); fs('#fff8d6', 3); }
  }
  g.globalAlpha = 0.3; g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(170, 300); g.lineTo(230, 300); g.lineTo(110, 640); g.lineTo(80, 640); g.fill();
  g.globalAlpha = 1; g.restore();
}

function clubBg(T, opt = {}) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#120818'); gr.addColorStop(1, '#2c0f35');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const beat = T / BEAT, flash = 1 - (beat % 1);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 2 + Math.sin(T * 0.9 + i * 1.3) * 0.7, ox = 40 + i * 128, hue = (i * 62 + T * 50) % 360;
    g.fillStyle = `hsla(${hue},100%,60%,${0.14 + 0.1 * flash})`;
    g.beginPath(); g.moveTo(ox, 60); g.lineTo(ox + Math.cos(a - 0.07) * 1600, 60 + Math.sin(a - 0.07) * 1600); g.lineTo(ox + Math.cos(a + 0.07) * 1600, 60 + Math.sin(a + 0.07) * 1600); g.fill();
  }
  g.restore();
  // disco ball
  line(360, 0, 360, 70, 3); ell(360, 120, 52, 52); fs('#c9c3d6');
  g.save(); ell(360, 120, 52, 52); g.clip();
  for (let i = -3; i <= 3; i++) { line(300, 120 + i * 15, 420, 120 + i * 15, 1.5); line(360 + i * 15 + ((T * 30) % 15), 60, 360 + i * 15 + ((T * 30) % 15), 180, 1.5); }
  g.restore();
  for (let i = 0; i < 4; i++) star(330 + rnd(i + Math.floor(T * 4)) * 60, 100 + rnd(i * 3 + Math.floor(T * 4)) * 40, 8, '#fff', 0);
  if (opt.sign) {
    g.save(); g.shadowColor = '#ff3fa0'; g.shadowBlur = 30; g.font = `92px ${FONT}`; g.textAlign = 'center'; g.fillStyle = '#ffd0ea';
    g.globalAlpha = 0.75 + 0.25 * flash; g.fillText('CLUB ♡', 360, 300); g.restore();
  }
  // floor tiles
  for (let i = 0; i < 9; i++) for (let j = 0; j < 6; j++) {
    const on = rnd(i * 7 + j * 13 + Math.floor(beat)) > 0.55;
    g.fillStyle = on ? `hsl(${(i * 40 + j * 70) % 360},90%,${45 + 15 * flash}%)` : '#1a0c22';
    g.fillRect(i * 80, 990 + j * 50, 80, 50);
  }
  line(-10, 990, 730, 990, 4);
  // crowd silhouettes
  if (!opt.noCrowd) for (let i = 0; i < 9; i++) {
    const x = i * 88 + 20, b = Math.abs(Math.sin((beat + rnd(i)) * Math.PI)) * 16, y = 900 - b + rnd(i * 5) * 30;
    g.fillStyle = '#0b0610'; ell(x, y, 38, 42); g.fill(); g.fillRect(x - 42, y + 30, 84, 120);
    if (i % 3 === 0) { g.lineWidth = 12; g.strokeStyle = '#0b0610'; g.beginPath(); g.moveTo(x + 30, y + 40); g.lineTo(x + 52, y - 40 - b); g.stroke(); }
  }
}

function bathroom(T) {
  g.fillStyle = '#1d3a44'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#2b5563'; g.lineWidth = 3;

function babblePlan(text, d) {

  const units = toks.reduce((n, c) => n + (c === ' ' ? 0.6 : 1), 0);
  const step = Math.min(0.115, (d - 0.15) / Math.max(units, 1));
  let at = 0; const syl = [];
  for (const c of toks) { if (c === ' ') at += step * 0.6; else { syl.push({ c, at }); at += step; } }
  return { syl, step, dur: at };
}

  const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  schedule(oac, master(oac), 0, 0);
  const buf = await oac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true);
  out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true);
  out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
    out.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.drawFrame = drawFrame;
window.DUR = DUR;

// ---------- player ----------
const btn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time'), sndBtn = document.getElementById('snd');
let playing = false, cur = 0, startPerf = 0, ac = null, muted = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function stopAudio() { if (ac) { ac.close(); ac = null; } }
function startAudio() {
  stopAudio();
  if (muted) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  schedule(ac, master(ac), ac.currentTime + 0.05 - cur, cur);
}
function play() {
  if (cur >= DUR - 0.05) cur = 0;
  playing = true; startPerf = performance.now() - cur * 1000; btn.textContent = '⏸ 정지';
  startAudio(); requestAnimationFrame(tick);
}
function pause() { playing = false; btn.textContent = '▶ 재생'; stopAudio(); }
function render() { drawFrame(cur); seek.value = Math.round((cur / DUR) * 1000); timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`; }
function tick() {
  if (!playing) return;
  cur = (performance.now() - startPerf) / 1000;
  if (cur >= DUR) { cur = DUR; pause(); }
  render();
  if (playing) requestAnimationFrame(tick);
}
btn.onclick = () => (playing ? pause() : play());
cv.onclick = () => (playing ? pause() : play());
seek.oninput = () => { cur = (seek.value / 1000) * DUR; if (playing) { startPerf = performance.now() - cur * 1000; startAudio(); } render(); };
sndBtn.onclick = () => { muted = !muted; sndBtn.textContent = muted ? '🔇' : '🔊'; if (playing) startAudio(); };

// Korean webfonts arrive in unicode-range subsets, so preload every string the film draws.
const ALL_TEXT = LINES.map(l => l.text).join('') + '광고너구리출몰무적모드밤새놀아도,얼굴은출근가능ㅈㄴ취함♡여기왔다감LOVECLUB';
window.ready = Promise.all([document.fonts.load(`40px 'Jua'`, ALL_TEXT)]).catch(() => {}).then(() => {
  cur = 11.5; render(); cur = 0;
  timeEl.textContent = `${fmt(0)} / ${fmt(DUR)}`; seek.value = 0;
});
</script>
