<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정전기 진상 손님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 16:9 flash-cartoon ad: a 3 a.m. convenience-store refund fight that suddenly turns into an over-the-top hair-essence commercial; product shown only as an '광고' mosaic. */
:root{color-scheme:dark;--bg:#0e0e10;--panel:#18181c;--fg:#f1f1f1;--muted:#9a9aa3;--accent:#7fd3ff}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-weight:700;font-size:20px;margin:4px 0 12px}
h1 span{color:var(--accent);font-weight:500}
canvas{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:10px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;font-size:15px;background:var(--panel);color:var(--fg);border:1px solid #2c2c33;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a4a55}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:84px;text-align:right}
p.note{color:var(--muted);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>스캘프 랩 애니 <span>정전기 진상 손님 (16:9)</span></h1>
  <canvas id="cv"></canvas>
  <div class="bar">
    <button id="play">▶ 재생</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="snd">🔊</button>
  </div>
  <p class="note">화면을 눌러도 재생/정지돼요. 대사는 자막, 목소리는 옹알옹알 효과음이고 소리는 전부 브라우저에서 합성됩니다. 제품은 끝까지 '광고' 모자이크로만 나와요.</p>
</div>
<script>
const W = 1280, H = 720;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

const OUT = '#1d1a1c';
const SUB = "'Noto Sans KR',sans-serif", HYPE = "'Black Han Sans',sans-serif";
let LWK = 1; // line-weight factor so close-ups don't get fat outlines

// ---------- math ----------
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const backOut = t => { t = clamp(t, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
// keyframes [[t, v], ...] with smoothstep between
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; return lerp(va, vb, ease((t - a) / (b - a))); }
  return keys[keys.length - 1][1];
}
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(t, 0, 1)))).join(',')})`;
}

// ---------- primitives ----------
function ink(lw = 3.5) { g.strokeStyle = OUT; g.lineWidth = lw * LWK; g.lineJoin = 'round'; g.lineCap = 'round'; }
function fs(fill, lw = 3.5) { if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { ink(lw); g.stroke(); } }
function ell(x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), rot, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function poly(pts) { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); }
function line(x1, y1, x2, y2, lw = 3.5, col = OUT) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); ink(lw); g.strokeStyle = col; g.stroke(); }
// closed smooth blob through points (midpoint quadratic)
function blob(pts) {
  g.beginPath();
  const n = pts.length, mid = i => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  const m0 = mid(n - 1); g.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const m = mid(i); g.quadraticCurveTo(pts[i][0], pts[i][1], m[0], m[1]); }
  g.closePath();
}

function star(x, y, r, col = '#fff6b0', rot = 0, lw = 2.5) {
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rad = i % 2 ? r * 0.3 : r; g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  g.closePath(); fs(col, lw); g.restore();
}
function twinkle(x, y, r, a = 1) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(0, -r); g.quadraticCurveTo(0, 0, r, 0); g.quadraticCurveTo(0, 0, 0, r); g.quadraticCurveTo(0, 0, -r, 0); g.quadraticCurveTo(0, 0, 0, -r); g.fill();
  g.restore();
}
function drop(x, y, s, col = '#9fe0ff') {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, -22); g.bezierCurveTo(10, -6, 14, 2, 14, 8); g.arc(0, 8, 14, 0, Math.PI); g.bezierCurveTo(-14, 2, -10, -6, 0, -22); g.closePath();
  fs(col, 3); ell(-5, 6, 3.5, 6, 0.3); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill(); g.restore();
}
function sweat(x, y, s, side = 1) {
  g.save(); g.translate(x, y); g.scale(s * side, s);
  g.beginPath(); g.moveTo(0, -14); g.bezierCurveTo(7, -3, 9, 3, 9, 7); g.arc(0, 7, 9, 0, Math.PI); g.bezierCurveTo(-9, 3, -7, -3, 0, -14); g.closePath();
  fs('#bfe8ff', 2.5); g.restore();
}

// Product placeholder: square pixel mosaic with "광고" in the middle, like a blurred-out brand.
function adBox(x, y, w, T, label = 0.2, rotY = 1) {
  const h = w, cell = Math.max(8, Math.round(w / 8)), k = Math.floor(T * 6);
  const pal = ['#dff4ff', '#bfe6ff', '#ffffff', '#9ed8f5', '#e9f8ff', '#7cc6ea', '#f3fbff', '#cfe0ff'];
  g.save(); g.translate(x + w / 2, y + h / 2); g.scale(rotY, 1); g.translate(-w / 2, -h / 2);
  g.save(); g.beginPath(); g.rect(0, 0, w, h); g.clip();
  for (let i = 0; i * cell < w; i++) for (let j = 0; j * cell < h; j++) {
    g.fillStyle = pal[Math.floor(rnd(i * 17 + j * 31 + k * 0.37) * pal.length)];
    g.fillRect(i * cell, j * cell, cell + 1, cell + 1);
  }
  g.restore();
  g.beginPath(); g.rect(0, 0, w, h); fs(null, 4);
  if (Math.abs(rotY) > 0.25) {
    const fz = w * label;
    g.font = `${fz}px ${HYPE}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText('광고').width + fz * 0.9;
    rr(w / 2 - tw / 2, h / 2 - fz * 0.78, tw, fz * 1.56, fz * 0.3); g.fillStyle = 'rgba(25,22,30,.9)'; g.fill();
    g.fillStyle = '#fff'; g.fillText('광고', w / 2, h / 2 + fz * 0.05);
  }
  g.restore();
}

// ---------- faces ----------
// e: {lx, ly, lid, ang, pup, big, sparkle}; ang > 0 = angry (inner corners low), < 0 = worried
function eyePair(cx, cy, r, gap, e, skin, ry = r * 1.04) {
  for (const side of [-1, 1]) {
    const x = cx + side * gap;
    ell(x, cy, r, ry); fs('#fff', 3.2);
    const pr = r * (e.pup ?? 0.15) * (e.big ?? 1);
    const px = x + clamp(e.lx ?? 0, -1, 1) * (r - pr) * 0.62, py = cy + clamp(e.ly ?? 0, -1, 1) * (ry - pr) * 0.55;
    if (e.sparkle) {
      const sr = lerp(pr, r * 0.55, e.sparkle);
      ell(px, py, sr, sr * 1.08); g.fillStyle = mixHex('#1d1a1c', '#3a2a5a', e.sparkle); g.fill();
      g.save(); g.globalAlpha = e.sparkle; ell(px - sr * 0.35, py - sr * 0.4, sr * 0.32, sr * 0.36); g.fillStyle = '#fff'; g.fill();
      ell(px + sr * 0.35, py + sr * 0.35, sr * 0.14, sr * 0.14); g.fill(); g.restore();
    } else { ell(px, py, pr, pr); g.fillStyle = OUT; g.fill(); }
    const lid = clamp(e.lid ?? 0, 0, 1), ang = e.ang ?? 0;
    if (lid > 0.01 || Math.abs(ang) > 0.01) {
      const yE = cy - ry + 2 * ry * lid, inner = yE + ang * r * 0.55, outer = yE - ang * r * 0.55;
      const yL = side < 0 ? outer : inner, yR = side < 0 ? inner : outer;
      if (Math.max(yL, yR) > cy - ry) {
        g.save(); ell(x, cy, r, ry); g.clip();
        poly([[x - r - 3, cy - ry - 3], [x + r + 3, cy - ry - 3], [x + r + 3, yR], [x - r - 3, yL]]);
        g.fillStyle = skin; g.fill();
        g.beginPath(); g.moveTo(x - r - 3, yL); g.lineTo(x + r + 3, yR); ink(3.2); g.stroke();
        g.restore();
        ell(x, cy, r, ry); fs(null, 3.2);
      }
    }
  }
}
// wide flat mouth line that opens into a dark lens when talking/shouting
function mouthLine(hw, y, open, curve = 0, lw = 3.4) {
  if (open < 0.04) { g.beginPath(); g.moveTo(-hw, y); g.quadraticCurveTo(0, y + curve, hw, y); ink(lw); g.stroke(); return; }
  const ow = hw * lerp(0.75, 0.95, open);
  g.beginPath(); g.moveTo(-ow, y); g.quadraticCurveTo(0, y - open * 5 + curve, ow, y); g.quadraticCurveTo(0, y + open * 30 + curve, -ow, y); g.closePath();
  fs('#5b2630', lw);
  g.save(); g.clip(); ell(0, y + open * 22 + curve, ow * 0.5, open * 9); g.fillStyle = '#d9606e'; g.fill(); g.restore();
  g.beginPath(); g.moveTo(-hw, y); g.lineTo(-ow, y); g.moveTo(hw, y); g.lineTo(ow, y); ink(lw); g.stroke();
}

// ---------- cast ----------
function blink(T, seed) { const c = (T * 0.31 + seed) % 1; return c < 0.035 ? Math.sin((c / 0.035) * Math.PI) : 0; }

// 알바 민수: buzz cut, permanent dark circles, convenience-store vest. x,y = feet.
const ASKIN = '#f3d7bd';
function alba(p) {
  const s = p.s ?? 1, T = p.T ?? 0, br = Math.sin(T * 1.9) * 1.3, wind = p.wind ?? 0;
  g.save(); g.translate(p.x, p.y); g.scale(s, s);
  for (const sd of [-1, 1]) { poly([[sd * 4, -150], [sd * 40, -150], [sd * 36, -8], [sd * 8, -8]]); fs('#3b4150'); ell(sd * 24, -6, 20, 9); fs('#f4f4f4', 3); }
  // grey long-sleeve tee + green vest
  g.beginPath(); g.moveTo(-34, -318 + br); g.quadraticCurveTo(-70, -310 + br, -70, -270); g.lineTo(-54, -148); g.lineTo(54, -148); g.lineTo(70, -270);
  g.quadraticCurveTo(70, -310 + br, 34, -318 + br); g.closePath(); fs('#8d929c');
  if (!p.noVest) {
    for (const sd of [-1, 1]) {
      g.beginPath(); g.moveTo(sd * 14, -316 + br); g.quadraticCurveTo(sd * 58, -312 + br, sd * 60, -270); g.lineTo(sd * 52, -150); g.lineTo(sd * 6, -150); g.lineTo(sd * 6, -250); g.closePath(); fs('#2f9e5b');
      g.beginPath(); g.moveTo(sd * 36, -310 + br); g.lineTo(sd * 30, -150); g.strokeStyle = '#f2f2ea'; g.lineWidth = 7 * LWK; g.stroke();
    }
    rr(-52, -262, 40, 22, 4); fs('#fbfbf6', 2.5);
    g.font = `900 14px ${SUB}`; g.fillStyle = '#1d1a1c'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('민수', -32, -250);
  }
  const arm = (sd, ex, ey, hx, hy) => {
    g.beginPath(); g.moveTo(sd * 60, -300 + br); g.quadraticCurveTo(ex, ey, hx, hy); ink(24); g.stroke();
    g.strokeStyle = '#8d929c'; g.lineWidth = 17 * LWK; g.stroke(); ell(hx, hy + 2, 11, 11); fs(ASKIN, 3);
  };
  arm(-1, -84, -240, -70, -168);
  const armR = p.armR ?? 'down';
  if (armR === 'down') arm(1, 84, -240, 70, -168);
  else if (armR === 'cup') arm(1, 40, -190, -10, -205);
  rr(-14, -340, 28, 30, 4); fs(ASKIN, 3);
  // head
  g.save(); g.translate(0, -404 + br * 0.5); g.rotate(p.tilt ?? 0);
  for (const sd of [-1, 1]) { ell(sd * 64, 6, 12, 17); fs(ASKIN, 3); }
  ell(0, 0, 64, 76); fs(ASKIN);
  // stubble
  g.save(); ell(0, 0, 64, 76); g.clip(); g.fillStyle = 'rgba(60,60,70,.28)';
  for (let i = 0; i < 40; i++) { const a = rnd(i * 2.7) * Math.PI, d = 50 + rnd(i * 5.3) * 22; ell(Math.cos(a) * d * 0.8, 40 + Math.sin(a) * d * 0.45, 1.6, 1.6); g.fill(); }
  g.restore();
  // buzz cut cap
  g.beginPath(); g.ellipse(0, 0, 66, 78, 0, Math.PI * 1.08, Math.PI * 1.92);
  g.quadraticCurveTo(46, -40, 40, -36); g.quadraticCurveTo(0, -52, -40, -36); g.quadraticCurveTo(-46, -40, Math.cos(Math.PI * 1.08) * 66, Math.sin(Math.PI * 1.08) * 78);
  g.closePath(); fs('#3a3b44');
  g.save(); g.clip(); g.fillStyle = 'rgba(255,255,255,.12)'; for (let i = 0; i < 30; i++) { ell((rnd(i) - 0.5) * 110, -50 - rnd(i * 3) * 26, 1.5, 1.5); g.fill(); } g.restore();
  // dark circles
  g.save(); g.globalAlpha = p.circles ?? 1;
  for (const sd of [-1, 1]) { ell(sd * 28, 20, 20, 9); g.fillStyle = 'rgba(120,90,150,.35)'; g.fill(); }
  g.restore();
  const e = Object.assign({ lx: 0, ly: 0, lid: 0.55, ang: -0.05 }, p.e || {});
  e.lid = Math.max(e.lid, blink(T, 0.41));
  eyePair(0, 2, 18, 28, e, ASKIN, 18);
  const bA = p.brow ?? 0;
  for (const sd of [-1, 1]) line(sd * 44, -24 + bA * 2 * 1, sd * 12, -24 - bA * 5, 4);
  g.beginPath(); g.moveTo(-2, 18); g.lineTo(-6, 34); g.lineTo(4, 34); ink(2.8); g.stroke();
  mouthLine(18, 52, p.say ?? 0, p.curve ?? 0, 3.2);
  if (p.sweat) for (let i = 0; i < p.sweat; i++) sweat(72 - i * 4, -24 + i * 26 + ((T * 30 + i * 13) % 14), 0.9 + i * 0.1);
  g.restore();
  if (armR === 'raise') {
    const up = p.armK ?? 1, hx = lerp(70, 104, up), hy = lerp(-170, -560, up);
    arm(1, lerp(84, 120, up), lerp(-240, -400, up), hx, hy);
    p.hand = { x: p.x + hx * s, y: p.y + hy * s };
  }
  if (armR === 'cup') p.hand = { x: p.x - 10 * s, y: p.y - 205 * s };
  g.restore();
}

// 진상 아줌마: wide face, tattooed brows, red lips, perm that can frizz (static) or turn silky.
const ZSKIN = '#f6d9c2', ZHAIR = '#4b2f3f';
function permHair(T, frizz, back) {
  const n = 15, R = 78 * (1 + frizz * 0.38);
  for (let i = 0; i < n; i++) {
    const a = Math.PI * (0.92 + 1.16 * (i / (n - 1))), jit = frizz * Math.sin(T * 40 + i * 2.1) * 3;
    const cr = (24 + rnd(i * 3.3) * 6) * (1 + frizz * 0.5);
    const x = Math.cos(a) * (R + jit), y = Math.sin(a) * (R * 0.92 + jit) - 6;
    if (back) { ell(x, y, cr, cr); fs(ZHAIR, 3.2); }
    else if (i % 2 === 0) { g.beginPath(); g.arc(x, y, cr * 0.55, 0.4, 2.6); g.strokeStyle = '#6e4a5e'; g.lineWidth = 2.5 * LWK; g.stroke(); }
  }
  if (back && frizz > 0.05) {
    // static spikes
    g.save(); g.globalAlpha = frizz;
    for (let i = 0; i < 18; i++) {
      const a = Math.PI * (0.95 + 1.1 * (i / 17)), r0 = R + 18, r1 = R + 42 + rnd(i) * 22 + Math.sin(T * 30 + i) * 6;
      g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a + 0.03) * (r0 + r1) / 2 + 6, Math.sin(a + 0.03) * (r0 + r1) / 2); g.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ink(3); g.strokeStyle = ZHAIR; g.stroke();
    }
    g.restore();
  }
}
function zap(x, y, s, T, i) {
  if (Math.sin(T * 23 + i * 5) < 0.2) return;
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(i);
  poly([[0, -18], [7, -4], [2, -3], [9, 14], [-5, 0], [1, -1], [-4, -16]]); fs('#fff36b', 2.5); g.restore();
}
function silkHair(T, wind, back) {
  // glossy chestnut shampoo-ad hair, side-parted, blown out to the right
  const w = i => Math.sin(T * 6 + i * 0.9) * 12 * wind + 18 * wind, C = '#7a4630';
  if (back) {
    blob([[-84, -20], [-78, -70], [-40, -98], [40, -98], [82, -66], [94, 0], [112 + w(1), 70], [156 + w(2) * 1.6, 140], [136 + w(3) * 1.4, 178],
      [92 + w(4), 128], [62, 92], [-62, 92], [-92 - w(5) * 0.3, 134], [-108 - w(6) * 0.3, 92], [-98, 30]]);
    fs(C);
    g.save(); g.globalAlpha = 0.55; g.beginPath(); g.ellipse(0, -10, 84, 86, 0, Math.PI * 1.12, Math.PI * 1.7); g.strokeStyle = '#ffe9d6'; g.lineWidth = 10 * LWK; g.stroke();
    g.beginPath(); g.moveTo(100, 40); g.quadraticCurveTo(130 + w(2), 110, 140 + w(3), 150); g.lineWidth = 6 * LWK; g.stroke(); g.restore();
  } else {
    g.beginPath(); g.moveTo(26, -82); g.bezierCurveTo(-30, -84, -76, -50, -82, 8); g.lineTo(-70, 12); g.bezierCurveTo(-60, -28, -24, -44, 30, -50);
    g.bezierCurveTo(56, -46, 74, -24, 80, 6); g.lineTo(86, 4); g.bezierCurveTo(84, -50, 66, -80, 26, -82); g.closePath(); fs(C, 3);
    g.save(); g.globalAlpha = 0.55; g.beginPath(); g.moveTo(-46, -54); g.quadraticCurveTo(-10, -74, 30, -70); g.strokeStyle = '#ffe9d6'; g.lineWidth = 5 * LWK; g.stroke(); g.restore();
  }
}
function ajumma(p) {
  const s = p.s ?? 1, T = p.T ?? 0, br = Math.sin(T * 2.1 + 1) * 1.4, frizz = p.frizz ?? 0, silk = p.silk ?? 0;
  g.save(); g.translate(p.x, p.y); g.scale(s, s);
  if (p.flip) g.scale(-1, 1);
  // legs: floral pants, slippers
  for (const sd of [-1, 1]) { poly([[sd * 4, -96], [sd * 42, -96], [sd * 38, -10], [sd * 8, -10]]); fs('#7a6aa8'); ell(sd * 24, -6, 22, 9); fs('#e8577a', 3); }
  // padded purple vest over flower blouse
  g.beginPath(); g.moveTo(-40, -236 + br); g.quadraticCurveTo(-86, -226 + br, -84, -170); g.lineTo(-70, -92); g.lineTo(70, -92); g.lineTo(84, -170);
  g.quadraticCurveTo(86, -226 + br, 40, -236 + br); g.closePath(); fs('#f2efe6');
  g.save(); g.clip(); for (let i = 0; i < 14; i++) { const x = (rnd(i * 2.2) - 0.5) * 150, y = -230 + rnd(i * 4.4) * 140; ell(x, y, 6, 6); g.fillStyle = ['#e8577a', '#f2b632', '#5fb0e6'][i % 3]; g.fill(); } g.restore();
  for (const sd of [-1, 1]) {
    g.beginPath(); g.moveTo(sd * 22, -234 + br); g.quadraticCurveTo(sd * 86, -228 + br, sd * 86, -170); g.lineTo(sd * 76, -92); g.lineTo(sd * 24, -92); g.closePath(); fs('#7d4fb0');
    for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(sd * 26, -200 + k * 28); g.quadraticCurveTo(sd * 54, -194 + k * 28, sd * 80, -200 + k * 28); ink(2); g.strokeStyle = '#5c3488'; g.stroke(); }

// Gibberish "옹알옹알" speech: one blip per Hangul syllable, pauses at spaces/punctuation.
function babblePlan(text, d) {
  const toks = Array.from(text).map(c => (/[가-힣]/.test(c) ? c : /[\s,…~.]/.test(c) ? ' ' : null)).filter(Boolean);
  const units = toks.reduce((n, c) => n + (c === ' ' ? 0.6 : 1), 0);
  const step = Math.min(0.13, (d - 0.15) / Math.max(units, 1));
  let at = 0; const syl = [];
  for (const c of toks) { if (c === ' ') at += step * 0.6; else { syl.push({ c, at }); at += step; } }
  return { syl, step, dur: at };
}

let acc = 0;
const LINES = [], EVENTS = [];
for (const s of SHOTS) {
  s.t0 = acc;
  (s.lines || []).forEach(([a, b, who, text]) => {
    const plan = babblePlan(text, b - a);
    LINES.push({ t0: acc + a, t1: acc + b, who, text, plan });
    EVENTS.push({ t: acc + a, type: 'babble', who, text, d: b - a });
  });
  (s.sfx || []).forEach(([a, type, d, arg]) => EVENTS.push({ t: acc + a, type, d, arg }));
  acc += s.d;
}
const DUR = acc;

// mouth openness for a speaker at time T, pulsing per syllable
function mouthAt(T, who) {
  for (const l of LINES) {
    if (l.who !== who || T < l.t0 || T >= l.t0 + l.plan.dur) continue;
    const u = T - l.t0;
    for (const s of l.plan.syl) if (u >= s.at && u < s.at + l.plan.step) {
      const f = (u - s.at) / l.plan.step;
      return Math.sin(f * Math.PI) * (0.55 + 0.45 * rnd(s.c.charCodeAt(0)));
    }
    return 0;
  }
  return 0;
}

function drawFrame(T) {
  T = clamp(T, 0, DUR - 1e-3);
  let shot = SHOTS[0];
  for (const s of SHOTS) if (T >= s.t0) shot = s;
  const t = T - shot.t0;
  g.setTransform(1, 0, 0, 1, 0, 0); LWK = 1;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  shot.draw(t, T, who => mouthAt(T, who));
  g.restore();
  for (const l of LINES) {
    if (T < l.t0 || T >= l.t1) continue;
    subtitle(l.text, Math.min(clamp((T - l.t0) / 0.08, 0, 1), clamp((l.t1 - T) / 0.08, 0, 1)));
  }
}

// ---------- audio ----------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function noiseBuf(ac) {
  if (ac._noise) return ac._noise;
  const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = rnd(i * 0.731) * 2 - 1;
  return (ac._noise = b);
}
function env(ac, out, t, a, hold, rel, peak) {
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t + a);
  gn.gain.setValueAtTime(peak, t + a + hold); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
  gn.connect(out); return gn;
}
function tone(ac, out, t, type, f0, f1, dur, peak) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(env(ac, out, t, 0.008, dur * 0.4, dur * 0.6, peak)); o.start(t); o.stop(t + dur + 0.05);
}
function noise(ac, out, t, dur, ftype, freq, q, peak, a = 0.01) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf(ac); s.loop = true;
  const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(env(ac, out, t, a, dur * 0.5, dur * 0.5, peak)); s.start(t); s.stop(t + dur + 0.05);
  return f;
}
// brass-ish stab: detuned saws through a swelling lowpass
function brass(ac, out, t, m, dur, peak) {
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
  lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(2600, t + 0.06); lp.frequency.exponentialRampToValueAtTime(1100, t + dur);
  lp.connect(env(ac, out, t, 0.02, dur * 0.6, dur * 0.4, peak));
  for (const d of [-7, 0, 7]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = d; o.connect(lp); o.start(t); o.stop(t + dur + 0.1); }
}

const PITCH = { A: 165, Z: 310, J: 140 };
const SYNTH = {
  babble(ac, out, t, e) {
    const F = { a: [850, 1300], e: [520, 1900], eo: [620, 1050], o: [460, 820], u: [350, 900], eu: [400, 1450], i: [320, 2300] };
    const MED = ['a', 'e', 'a', 'e', 'eo', 'e', 'eo', 'e', 'o', 'a', 'e', 'e', 'o', 'u', 'eo', 'e', 'i', 'u', 'eu', 'i', 'i'];
    const base = PITCH[e.who], end = /[?]/.test(e.text) ? 1.35 : /!/.test(e.text) ? 1.15 : /[….]$/.test(e.text) ? 0.85 : 1;
    const { syl, step } = babblePlan(e.text, e.d), flat = e.who === 'A' ? 0.03 : 0.1;
    syl.forEach(({ c, at }, i) => {
      const code = c.charCodeAt(0) - 0xac00, [f1, f2] = F[MED[Math.floor((code % 588) / 28)]];
      const last = i === syl.length - 1, p = base * (1 + flat * Math.sin(i * 1.9) + (rnd(code) - 0.5) * flat) * (last ? end : 1);
      const st = t + at, dur = step * 0.92;
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(p * (last && end > 1 ? 0.92 : 1.04), st); o.frequency.linearRampToValueAtTime(p * (last && end > 1 ? 1.08 : 0.96), st + dur);
      const amp = env(ac, out, st, 0.012, dur * 0.45, dur * 0.5, e.who === 'A' ? 0.65 : 0.5);
      const fk = e.who === 'A' ? 0.95 : 1.1;
      for (const [f, q, gn] of [[f1 * fk, 6, 1], [f2 * fk, 9, 0.5]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        const gg = ac.createGain(); gg.gain.value = gn; o.connect(bp); bp.connect(gg); gg.connect(amp);
      }
      o.start(st); o.stop(st + dur + 0.05);
      tone(ac, out, st, 'sine', p, p * 0.97, dur, 0.08);
      if (code % 28) tone(ac, out, st + dur * 0.55, 'sine', p * 0.9, p * 0.85, dur * 0.4, 0.06);
    });
  },
  // store door chime: the classic two-tone "딩동~"
  doorbell(ac, out, t) { [[88, 0], [84, 0.32], [88, 0.64], [84, 0.96]].forEach(([m, d], i) => { tone(ac, out, t + d, 'sine', mtof(m), mtof(m), 0.6, i < 2 ? 0.14 : 0.07); tone(ac, out, t + d, 'triangle', mtof(m - 12), mtof(m - 12), 0.4, 0.03); }); },
  crickets(ac, out, t, e) { for (let i = 0; i < e.d * 3; i++) { const st = t + i / 3 + rnd(i) * 0.1; for (let k = 0; k < 3; k++) tone(ac, out, st + k * 0.035, 'sine', 4300, 4250, 0.025, 0.035); } },
  buzz(ac, out, t, e) { tone(ac, out, t, 'sawtooth', 120, 120, e.d, 0.012); },
  hum(ac, out, t, e) { noise(ac, out, t, e.d, 'lowpass', 300, 0.7, 0.05, 0.3); tone(ac, out, t, 'sine', 60, 60, e.d, 0.02); },
  drip1(ac, out, t) { tone(ac, out, t + 0.45, 'sine', 1300, 380, 0.12, 0.35); },
  bang(ac, out, t) { noise(ac, out, t, 0.3, 'lowpass', 700, 1, 1.0, 0.002); tone(ac, out, t, 'sine', 110, 45, 0.3, 0.9); noise(ac, out, t + 0.02, 0.4, 'bandpass', 2500, 3, 0.2, 0.002); },
  static(ac, out, t, e) { for (let i = 0; i < e.d * 9; i++) { const st = t + i / 9 + rnd(i * 3) * 0.08; noise(ac, out, st, 0.02 + rnd(i) * 0.03, 'highpass', 3000 + rnd(i * 5) * 4000, 1, 0.12 + rnd(i * 7) * 0.12, 0.001); } },
  rewind(ac, out, t, e) { for (let i = 0; i < e.d * 16; i++) tone(ac, out, t + i / 16, 'square', 1800 - (i % 4) * 300, 600, 0.05, 0.05); const f = noise(ac, out, t, e.d, 'bandpass', 800, 2, 0.35, 0.02); f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(4000, t + e.d); },
  spray(ac, out, t) { noise(ac, out, t, 0.7, 'highpass', 5000, 0.8, 0.35, 0.02); },
  sting(ac, out, t) { tone(ac, out, t, 'sawtooth', 90, 900, 0.25, 0.12); noise(ac, out, t, 0.25, 'bandpass', 1200, 1, 0.3, 0.2); },
  boom(ac, out, t) {
    tone(ac, out, t, 'sine', 120, 40, 0.8, 1.0); noise(ac, out, t, 1.6, 'highpass', 4000, 0.7, 0.35, 0.005);
    const f = noise(ac, out, t, 0.6, 'bandpass', 500, 1, 0.5, 0.01); f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.5);
  },
  choir(ac, out, t, e) {
    // "아~" chord: saws through vowel formants
    for (const m of [60, 64, 67, 72, 76]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = (rnd(m) - 0.5) * 14;
      const amp = env(ac, out, t, 0.08, e.d * 0.5, e.d * 0.5, 0.06);
      for (const [f, q, gn] of [[800, 5, 1], [1200, 7, 0.6], [2800, 9, 0.2]]) { const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; const gg = ac.createGain(); gg.gain.value = gn; o.connect(bp); bp.connect(gg); gg.connect(amp); }
      o.start(t); o.stop(t + e.d + 0.1);
    }
  },
  fanfare(ac, out, t, e) {
    // epic "commercial" fanfare at 132 bpm: kick/snare, brass chords, bright lead
    const b = 60 / 132, prog = [[60, 64, 67], [65, 69, 72], [67, 71, 74], [64, 67, 72]], lead = [72, 74, 76, 79, 77, 76, 74, 76, 79, 81, 79, 84];
    for (let i = 0; i * b < e.d; i++) {
      const nt = t + i * b; if (nt < ac.currentTime + 0.02) continue;
      const fade = clamp((e.d - i * b) / 0.6, 0, 1);
      tone(ac, out, nt, 'sine', 150, 42, 0.25, 0.9 * fade);
      if (i % 2) { noise(ac, out, nt, 0.16, 'bandpass', 1800, 0.8, 0.45 * fade, 0.002); tone(ac, out, nt, 'triangle', 220, 160, 0.08, 0.2 * fade); }
      noise(ac, out, nt + b / 2, 0.04, 'highpass', 8000, 1, 0.12 * fade, 0.002);
      if (i % 2 === 0) { const ch = prog[Math.floor(i / 4) % 4]; ch.forEach(m => brass(ac, out, nt, m, b * 1.7, 0.05 * fade)); brass(ac, out, nt, ch[0] - 24, b * 1.8, 0.07 * fade); }
      tone(ac, out, nt, 'square', mtof(lead[i % lead.length]), mtof(lead[i % lead.length]), b * 0.8, 0.035 * fade);
      tone(ac, out, nt, 'sine', mtof(lead[i % lead.length] + 12), mtof(lead[i % lead.length] + 12), b * 0.6, 0.04 * fade);
    }
  },
  sparkle(ac, out, t) { [84, 88, 91, 96, 100, 103].forEach((m, i) => tone(ac, out, t + i * 0.05, 'sine', mtof(m), mtof(m), 0.35, 0.07)); },
  ting(ac, out, t) { tone(ac, out, t, 'sine', 2093, 2093, 0.9, 0.18); tone(ac, out, t, 'sine', 3136, 3136, 0.7, 0.1); tone(ac, out, t + 0.06, 'sine', 4186, 4186, 0.5, 0.06); },
  slam(ac, out, t) { noise(ac, out, t, 0.25, 'lowpass', 900, 1, 0.8, 0.002); tone(ac, out, t, 'sine', 140, 50, 0.3, 0.7); noise(ac, out, t, 0.5, 'highpass', 6000, 1, 0.15, 0.002); },
  whoosh(ac, out, t) { const f = noise(ac, out, t, 0.6, 'bandpass', 600, 1.2, 0.4, 0.2); f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.6); },
  gasp(ac, out, t) {
    const f = noise(ac, out, t, 0.8, 'bandpass', 900, 2.5, 0.45, 0.15); f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(1400, t + 0.4);
    [300, 380, 460].forEach((fr, i) => tone(ac, out, t + i * 0.03, 'triangle', fr, fr * 1.4, 0.5, 0.06));
  },
  scratch(ac, out, t) {
    // record scratch: fast down-up band sweep, then dead air
    const f = noise(ac, out, t, 0.32, 'bandpass', 1500, 4, 0.9, 0.003);
    f.frequency.setValueAtTime(2800, t); f.frequency.exponentialRampToValueAtTime(300, t + 0.12); f.frequency.exponentialRampToValueAtTime(1800, t + 0.22); f.frequency.exponentialRampToValueAtTime(200, t + 0.32);
  },
  jingle(ac, out, t) { [[72, 0], [76, 0.14], [79, 0.28], [84, 0.42]].forEach(([m, d]) => { tone(ac, out, t + d, 'triangle', mtof(m), mtof(m), 0.4, 0.14); tone(ac, out, t + d, 'sine', mtof(m + 12), mtof(m + 12), 0.3, 0.05); }); brass(ac, out, t + 0.56, 60, 1.2, 0.05); brass(ac, out, t + 0.56, 64, 1.2, 0.05); brass(ac, out, t + 0.56, 67, 1.2, 0.05); },
};

const LONG = ['hum', 'crickets', 'buzz', 'static', 'fanfare', 'choir', 'rewind'];
function schedule(ac, out, base, from) {
  for (const e of EVENTS) {
    if (!SYNTH[e.type]) continue;
    if (LONG.includes(e.type) ? e.t + e.d < from : e.t < from) continue;
    SYNTH[e.type](ac, out, base + e.t, e);
  }
}
function master(ac) {
  const comp = ac.createDynamicsCompressor(), gn = ac.createGain();
  gn.gain.value = 0.9; gn.connect(comp); comp.connect(ac.destination); return gn;
}

window.renderAudioWav = async () => {
  const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  schedule(oac, master(oac), 0, 0);
  const buf = await oac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true);
  out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true);
  out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
    out.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.drawFrame = drawFrame;
window.DUR = DUR;

// ---------- player ----------
const btn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time'), sndBtn = document.getElementById('snd');
let playing = false, cur = 0, startPerf = 0, ac = null, muted = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function stopAudio() { if (ac) { ac.close(); ac = null; } }
function startAudio() {
  stopAudio();
  if (muted) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  schedule(ac, master(ac), ac.currentTime + 0.05 - cur, cur);
}
function play() {
  if (cur >= DUR - 0.05) cur = 0;
  playing = true; startPerf = performance.now() - cur * 1000; btn.textContent = '⏸ 정지';
  startAudio(); requestAnimationFrame(tick);
}
function pause() { playing = false; btn.textContent = '▶ 재생'; stopAudio(); }
function render() { drawFrame(cur); seek.value = Math.round((cur / DUR) * 1000); timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`; }
function tick() {
  if (!playing) return;
  cur = (performance.now() - startPerf) / 1000;
  if (cur >= DUR) { cur = DUR; pause(); }
  render();
  if (playing) requestAnimationFrame(tick);
}
btn.onclick = () => (playing ? pause() : play());
cv.onclick = () => (playing ? pause() : play());
seek.oninput = () => { cur = (seek.value / 1000) * DUR; if (playing) { startPerf = performance.now() - cur * 1000; startAudio(); } render(); };
sndBtn.onclick = () => { muted = !muted; sndBtn.textContent = muted ? '🔇' : '🔊'; if (playing) startAudio(); };

// Korean webfonts arrive in unicode-range subsets, so preload every string the film draws.
const ALL_TEXT = LINES.map(l => l.text).join('') + '※이영상에는유료광고가포함되어있습니다.새벽3:12바로마트24민수Z...어쩌다이렇게됐냐면◀3분전';
const HYPE_TEXT = '컵라면국물환불해달라는손님광고잠깐!!!정전기박멸헤어에센스등장부스스→찰랑헉뿌리는순간72시간';
window.ready = Promise.all([
  document.fonts.load(`700 36px 'Noto Sans KR'`, ALL_TEXT + '부스스한머리,뿌리면찰랑·지금프로필링크에서'),
  document.fonts.load(`900 36px 'Noto Sans KR'`, ALL_TEXT + '부스스한머리,뿌리면찰랑·지금프로필링크에서'),
  document.fonts.load(`500 22px 'Noto Sans KR'`, ALL_TEXT),
  document.fonts.load(`40px 'Black Han Sans'`, HYPE_TEXT),
]).catch(() => {}).then(() => {
  cur = 0.6; render(); cur = 0;
  timeEl.textContent = `${fmt(0)} / ${fmt(DUR)}`; seek.value = 0;
});
</script>
