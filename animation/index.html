<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>풀매수 금지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* Standalone cartoon short: doodle-style characters drawn on a canvas, synthesized voices/SFX via Web Audio. */
:root{color-scheme:dark;--bg:#0e0e10;--panel:#18181c;--fg:#f1f1f1;--muted:#9a9aa3;--accent:#ff3b3b}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Jua',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:26px;margin:4px 0 12px}
h1 span{color:var(--accent)}
.stage{position:relative}
canvas{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:12px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;font-size:16px;background:var(--panel);color:var(--fg);border:1px solid #2c2c33;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a4a55}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:84px;text-align:right}
p.note{color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>스캘프 랩 애니 <span>#1 풀매수 금지</span></h1>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="bar">
    <button id="play">▶ 재생</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="snd">🔊</button>
  </div>
  <p class="note">화면을 눌러도 재생/정지돼요. 대사는 TTS 더빙, 효과음과 BGM은 브라우저에서 바로 합성됩니다.</p>
</div>
<script src="voices.js"></script>
<script>
const W = 1280, H = 720;
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

const INK = '#161616', SKIN = '#f7d2b4';
const UP = '#ff4257', DOWN = '#3d8bff';
const FONT_T = "'Black Han Sans','Jua',sans-serif";
const FONT_S = "'Jua','Black Han Sans',sans-serif";

// ---------- math ----------
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const backOut = t => { t = clamp(t, 0, 1); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---------- drawing primitives ----------
function ink(lw = 4) { g.strokeStyle = INK; g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; }
function fs(fill, lw = 4) { if (fill) { g.fillStyle = fill; g.fill(); } ink(lw); g.stroke(); }
function ell(x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), 0, 0, Math.PI * 2); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function line(x1, y1, x2, y2, lw = 4) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); ink(lw); g.stroke(); }

function bigText(txt, x, y, size, fill, rot = 0, sc = 1) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(sc, sc);
  g.font = `${size}px ${FONT_T}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = size * 0.26; g.strokeStyle = INK; g.strokeText(txt, 0, 0);
  g.lineWidth = size * 0.13; g.strokeStyle = '#fff'; g.strokeText(txt, 0, 0);
  g.fillStyle = fill; g.fillText(txt, 0, 0);
  g.restore();
}

function subtitle(txt) {
  g.save();
  g.font = `44px ${FONT_S}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.9)'; g.strokeText(txt, W / 2, H - 52);
  g.fillStyle = '#fff'; g.fillText(txt, W / 2, H - 52);
  g.restore();
}

function withCam(z, cx, cy, fn) { g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-cx, -cy); fn(); g.restore(); }

function focusLines(cx, cy, bg, col, T, r0 = 300) {
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const seed = Math.floor(T * 12);
  g.fillStyle = col;
  for (let i = 0; i < 90; i++) {
    const a = (i / 90) * Math.PI * 2 + rnd(i + seed * 3.1) * 0.05;
    const r1 = r0 + rnd(i * 7 + seed) * 140, wdt = 0.006 + rnd(i * 3 + seed) * 0.014;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    g.lineTo(cx + Math.cos(a - wdt) * 1400, cy + Math.sin(a - wdt) * 1400);
    g.lineTo(cx + Math.cos(a + wdt) * 1400, cy + Math.sin(a + wdt) * 1400);
    g.fill();
  }
}

function sunburst(cx, cy, c1, c2, T) {
  g.fillStyle = c1; g.fillRect(0, 0, W, H);
  g.save(); g.translate(cx, cy); g.rotate(T * 0.4); g.fillStyle = c2;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 1500, a, a + Math.PI / 16); g.fill();
  }
  g.restore();
}

function sparkle(x, y, r) {
  g.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, rad = i % 2 ? r * 0.3 : r;
    g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath(); fs('#fff7a8', 3);
}

// ---------- characters ----------
// Shared face parts. Everything is in head-local units: head ~80 radius, origin at head center.
function eye(x, y, r, p, blink) {
  if (p.tremble) {
    const k = Math.floor(p.t * 30);
    x += (rnd(k + x) * 2 - 1) * p.tremble; y += (rnd(k * 1.7 + y + 5) * 2 - 1) * p.tremble;
  }
  ell(x, y, r, r * (blink ? 0.1 : 1)); fs('#fff', 4);
  if (blink) return;
  const pr = r * 0.27 * (p.pupil ?? 1), max = r - pr - 5;
  const lx = clamp(p.lx || 0, -1, 1), ly = clamp(p.ly || 0, -1, 1);
  ell(x + lx * max, y + ly * max, pr, pr); g.fillStyle = INK; g.fill();
  if (p.lid) {
    // half-closed deadpan lid
    g.save(); ell(x, y, r, r); g.clip();
    g.fillStyle = p.skin || SKIN; g.fillRect(x - r - 2, y - r - 2, 2 * r + 4, 2 * r * p.lid + 2);
    line(x - r, y - r + 2 * r * p.lid, x + r, y - r + 2 * r * p.lid, 4);
    g.restore();
    ell(x, y, r, r); ink(4); g.stroke();
  }
}

function brows(p, dx, y) {
  if (!p.brow) return;
  const s = p.brow === 'mad' ? 1 : -1; // mad: inner ends low. worried: inner ends high
  line(-dx - 22, y - 8 * s, -dx + 18, y + 8 * s, 7);
  line(dx + 22, y - 8 * s, dx - 18, y + 8 * s, 7);
}

function mouth(p, w, y, open) {
  if (open > 0.05) {
    g.beginPath(); g.moveTo(-24, y); g.quadraticCurveTo(0, y + 40 * open, 24, y); g.closePath(); fs('#7a2626', 3);
  }
  if (p.mouth === 'wavy') {
    g.beginPath(); g.moveTo(-w, y);
    for (let i = 1; i <= 8; i++) g.lineTo(-w + (2 * w * i) / 8, y + (i % 2 ? -6 : 6));
    ink(4); g.stroke();
  } else if (p.mouth === 'smile') {
    g.beginPath(); g.moveTo(-w, y - 6); g.quadraticCurveTo(0, y + 16, w, y - 6); ink(4); g.stroke();
  } else {
    line(-w, y, w, y, 4);
  }
}

function paleFx(p, headPath) {
  if (!p.pale) return;
  g.save(); headPath(); g.clip();
  const gr = g.createLinearGradient(0, -90, 0, 10);
  gr.addColorStop(0, `rgba(80,90,210,${0.55 * p.pale})`); gr.addColorStop(1, 'rgba(80,90,210,0)');
  g.fillStyle = gr; g.fillRect(-120, -120, 240, 140);
  g.strokeStyle = `rgba(50,50,160,${0.8 * p.pale})`; g.lineWidth = 3;
  for (let i = -66; i <= 66; i += 13) {
    g.beginPath(); g.moveTo(i, -100); g.lineTo(i, -40 + (Math.abs(i) % 26 ? 0 : 14)); g.stroke();
  }
  g.restore();
}

function sweat(p) {
  if (!p.sweat) return;
  for (let i = 0; i < p.sweat; i++) {
    const side = i % 2 ? -1 : 1, ph = (p.t * 0.7 + i * 0.37) % 1;
    const x = side * (84 + i * 6), y = -40 + ph * 70 + i * 8;
    g.beginPath(); g.moveTo(x, y - 18); g.quadraticCurveTo(x + 11, y + 2, x, y + 8); g.quadraticCurveTo(x - 11, y + 2, x, y - 18);
    fs('#9fd8ff', 3);
  }
}

function talkOpen(p) { return p.talk ? 0.3 + 0.7 * Math.abs(Math.sin(p.t * 17 + Math.sin(p.t * 5))) : 0; }
function isBlink(p) { return !p.noBlink && ((p.t * 0.43 + (p.seed || 0)) % 1) < 0.035; }

function tee(p, shirt, shorts) {
  const skin = p.skin || SKIN;
  // legs + feet
  line(-22, 212, -24, 258, 6); line(22, 212, 24, 258, 6);
  ell(-32, 262, 16, 8); fs('#fff', 4); ell(32, 262, 16, 8); fs('#fff', 4);
  // shorts
  g.beginPath(); g.moveTo(-50, 160); g.lineTo(50, 160); g.lineTo(58, 220); g.lineTo(6, 222); g.lineTo(0, 196); g.lineTo(-6, 222); g.lineTo(-58, 220); g.closePath(); fs(shorts);
  // arms (behind sleeves): armL/armR 0 = down, 1 = raised pointing outward
  const arm = (side, a) => {
    const hx = side * lerp(70, 140, a), hy = lerp(178, 40, a);
    line(side * 66, 120, hx, hy, 6);
    ell(hx, hy, 11, 11); fs(skin, 4);
  };
  arm(-1, p.armL || 0); arm(1, p.armR || 0);
  // shirt
  g.beginPath(); g.moveTo(-30, 60); g.lineTo(30, 60); g.lineTo(62, 78); g.lineTo(78, 118); g.lineTo(56, 128); g.lineTo(50, 108);
  g.lineTo(52, 170); g.lineTo(-52, 170); g.lineTo(-50, 108); g.lineTo(-56, 128); g.lineTo(-78, 118); g.lineTo(-62, 78); g.closePath(); fs(shirt);
  g.beginPath(); g.arc(0, 60, 16, 0.15, Math.PI - 0.15); ink(3); g.stroke();
}

// 민수: spiky hair, round head
function minsu(p) {
  g.save(); g.translate(p.x, p.y); g.scale(p.s, p.s);
  if (p.body !== false) tee(p, '#ffffff', '#f2c230');
  const open = talkOpen(p), blink = isBlink(p);
  g.translate(0, p.talk ? Math.sin(p.t * 9) * 3 : Math.sin(p.t * 2 + 1) * 1.2);
  const skin = p.skin || SKIN;
  ell(-78, 10, 12, 16); fs(skin); ell(78, 10, 12, 16); fs(skin);
  const head = () => ell(0, 0, 80, 76);
  head(); fs(skin);
  paleFx(p, head);
  g.beginPath(); g.moveTo(-80, -8);
  [[-90, -48], [-72, -50], [-80, -94], [-50, -78], [-44, -124], [-20, -92], [-2, -132], [14, -94], [38, -126], [46, -86], [80, -106], [70, -64], [94, -56], [80, -8]]
    .forEach(([x, y]) => g.lineTo(x, y));
  g.quadraticCurveTo(40, -40, 0, -46); g.quadraticCurveTo(-40, -40, -80, -8); g.closePath();
  fs(INK, 3);
  eye(-31, 4, 31, p, blink); eye(31, 4, 31, p, blink);
  brows(p, 31, -36);
  mouth(p, 58, 46, open);
  sweat(p);
  g.restore();
}

// 준호: long chin, bowl cut, glasses
function junho(p) {
  g.save(); g.translate(p.x, p.y); g.scale(p.s, p.s);
  if (p.body !== false) { g.save(); g.translate(0, 22); tee(p, '#2f62c0', '#8a8f9a'); g.restore(); }
  const open = talkOpen(p), blink = isBlink(p);
  g.translate(0, p.talk ? Math.sin(p.t * 9) * 3 : Math.sin(p.t * 2) * 1.2);
  const skin = p.skin || SKIN;
  const head = () => {
    g.beginPath(); g.moveTo(0, -84);
    g.bezierCurveTo(50, -84, 72, -52, 70, -6); g.bezierCurveTo(68, 52, 28, 112, 0, 118);
    g.bezierCurveTo(-28, 112, -68, 52, -70, -6); g.bezierCurveTo(-72, -52, -50, -84, 0, -84);
  };
  ell(-70, 8, 10, 15); fs(skin); ell(70, 8, 10, 15); fs(skin);
  head(); fs(skin);
  paleFx(p, head);
  g.beginPath(); g.moveTo(-74, -4); g.bezierCurveTo(-82, -104, 82, -104, 74, -4);
  [[60, -30], [42, -38], [22, -32], [2, -42], [-20, -34], [-40, -40], [-60, -30]].forEach(([x, y]) => g.lineTo(x, y));
  g.closePath(); fs(INK, 3);
  eye(-28, 8, 25, p, blink); eye(28, 8, 25, p, blink);
  // glasses
  g.save(); ink(3);
  ell(-28, 8, 32, 32); g.stroke(); ell(28, 8, 32, 32); g.stroke();
  g.beginPath(); g.moveTo(-60, 4); g.lineTo(-71, 0); g.moveTo(60, 4); g.lineTo(71, 0); g.stroke();
  g.restore();
  brows(p, 28, -32);
  mouth(p, 36, 68, open);
  sweat(p);
  g.restore();
}

// 로봇: box head, yellow square eyes, treads
function robot(p) {
  g.save(); g.translate(p.x, p.y); g.scale(p.s, p.s);
  const roll = p.roll || 0;
  rr(-78, 206, 156, 46, 23); fs('#d6d6d6');
  for (let i = 0; i < 5; i++) {
    const x = -52 + i * 26; ell(x, 229, 11, 11); fs('#8b8b8b', 3);
    const a = roll + i; line(x, 229, x + Math.cos(a) * 9, 229 + Math.sin(a) * 9, 2);
  }
  line(-50, 150, -96, 120 - (p.armUp || 0) * 70, 5);
  line(50, 150, 96, 180, 5);
  const claw = (x, y) => { g.beginPath(); g.moveTo(x - 8, y - 10); g.lineTo(x, y); g.lineTo(x + 8, y - 10); ink(4); g.stroke(); };
  claw(-96, 120 - (p.armUp || 0) * 70); claw(96, 180);
  rr(-58, 74, 116, 134, 8); fs('#fbfbfb');
  rr(-26, 98, 52, 70, 5); fs('#ececec', 3);
  for (let i = 0; i < 3; i++) line(-14, 114 + i * 16, 14, 114 + i * 16, 3);
  ell(-38, 96, 5, 5); fs(p.talk && Math.sin(p.t * 20) > 0 ? '#ff5050' : '#a33', 2);
  rr(-16, 56, 32, 22, 3); fs('#bdbdbd', 3);
  g.translate(0, p.talk ? Math.sin(p.t * 14) * 2 : 0);
  rr(-90, -16, 16, 34, 4); fs('#bdbdbd', 3); rr(74, -16, 16, 34, 4); fs('#bdbdbd', 3);
  line(-90, 0, -112, 0, 3); line(90, 0, 112, 0, 3);
  ell(-116, 0, 6, 6); fs('#ff5050', 3); ell(116, 0, 6, 6); fs('#ff5050', 3);
  rr(-74, -72, 148, 130, 12); fs('#fdfdfd');
  const glow = p.talk && Math.sin(p.t * 22) > 0;
  const ey = (x) => {
    rr(x - 18, -44, 36, 42, 4); fs(glow ? '#ffe46b' : '#f5c518');
    const lx = clamp(p.lx || 0, -1, 1) * 9;
    g.fillStyle = INK; g.fillRect(x - 5 + lx, -28, 10, 12);
  };
  ey(-30); ey(30);
  rr(-58, 18, 116, 18, 3); fs(glow ? '#c8c8c8' : '#9a9a9a', 3);
  for (let i = 1; i < 10; i++) line(-58 + i * 11.6, 20, -58 + i * 11.6, 34, 2);
  g.restore();
}

// ---------- set ----------
function room() {
  for (let i = -8; i < 30; i++) {
    const x = i * 64;
    g.fillStyle = i % 2 ? '#c48a52' : '#cf955e'; g.fillRect(x, -300, 64, 870);
    g.strokeStyle = '#7d4f27'; g.lineWidth = 3; g.beginPath(); g.moveTo(x, -300); g.lineTo(x, 562); g.stroke();
    const sy = 40 + rnd(i) * 420;
    g.beginPath(); g.moveTo(x, sy); g.lineTo(x + 64, sy); g.stroke();
    if (rnd(i + 9) > 0.6) { ell(x + 32, 120 + rnd(i + 3) * 340, 7, 10); g.strokeStyle = '#8d5a2c'; g.lineWidth = 2; g.stroke(); }
  }
  g.fillStyle = '#efe5cc'; g.fillRect(-600, 560, 2600, 600);
  line(-600, 560, 2000, 560, 5);
  // bear-print quilt
  for (let r = 0; r < 4; r++) for (let c = -6; c < 26; c++) {
    const x = c * 90 + (r % 2) * 45, y = 600 + r * 50;
    g.fillStyle = '#f2a73b'; ell(x, y, 13, 11); g.fill(); ell(x - 10, y - 10, 5, 5); g.fill(); ell(x + 10, y - 10, 5, 5); g.fill();
  }
  // blue blanket corner
  g.beginPath(); g.moveTo(-600, 640); g.lineTo(260, 610); g.lineTo(340, 760); g.lineTo(-600, 760); g.closePath(); fs('#3a56a6');
  // poster
  rr(1030, 110, 170, 230, 4); fs('#fff6dc');
  g.save(); g.translate(1115, 210); g.rotate(-0.5);
  rr(-16, -50, 32, 90, 16); fs('#ff5a5a', 3);
  g.beginPath(); g.moveTo(-14, 30); g.lineTo(-28, 54); g.lineTo(-6, 40); g.moveTo(14, 30); g.lineTo(28, 54); g.lineTo(6, 40); ink(3); g.stroke();
  ell(0, -14, 8, 8); fs('#9fd8ff', 3);
  g.restore();
  g.font = `30px ${FONT_T}`; g.textAlign = 'center'; g.fillStyle = '#e02828'; g.fillText('가즈아', 1115, 318);
  // ramen cups
  const cup = (x, y) => {
    g.beginPath(); g.moveTo(x - 24, y - 50); g.lineTo(x + 24, y - 50); g.lineTo(x + 18, y); g.lineTo(x - 18, y); g.closePath(); fs('#fff8e8');
    g.fillStyle = '#e53935'; g.fillRect(x - 21, y - 34, 41, 12); line(x - 21, y - 34, x + 21, y - 34, 2);
    ell(x, y - 50, 24, 6); fs('#f6c14b', 3);
  };
  cup(1150, 680); cup(1205, 668);
}

function monitor(x, y, w, h, screen) {
  rr(x, y, w, h, 14); fs('#2a2a2e', 5);
  g.save(); rr(x + 14, y + 14, w - 28, h - 28, 6); g.clip();
  screen(x + 14, y + 14, w - 28, h - 28);
  g.restore();
  rr(x + 14, y + 14, w - 28, h - 28, 6); ink(3); g.stroke();
}

// ---------- price data ----------
function seg(from, to, n, seed, shape = u => u) {
  const a = [];
  for (let i = 1; i <= n; i++) {
    const u = i / n, v = lerp(from, to, shape(u));
    a.push(i === n ? v : v * (1 + (rnd(seed * 100 + i) - 0.5) * 0.045));
  }
  return a;
}
const BUY = 130;
const P1 = [100, ...seg(100, 130, 60, 1, u => u * u)];
const P2 = P1.concat(seg(130, 91, 30, 2, u => u * u));
const P3 = P2.concat(seg(91, 39, 30, 3, u => Math.sqrt(u)));
const P4 = P3.concat(seg(39, 520, 40, 4, u => u * u * u));

function chart(x, y, w, h, all, shown, opt = {}) {
  const arr = all.slice(0, Math.max(2, Math.round(shown)));
  g.fillStyle = '#0c111b'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#1b2433'; g.lineWidth = 1;
  for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x, y + (h * i) / 5); g.lineTo(x + w, y + (h * i) / 5); g.stroke(); }
  let mn = Math.min(...arr, opt.buy ? BUY : Infinity), mx = Math.max(...arr, opt.buy ? BUY : -Infinity);
  const pad = (mx - mn) * 0.12 + 1; mn -= pad; mx += pad;
  const N = all.length, top = y + h * 0.2, bot = y + h - 16;
  const xs = i => x + 16 + (w - 130) * i / (N - 1), ys = v => bot - (bot - top) * (v - mn) / (mx - mn);
  const last = arr[arr.length - 1], col = last >= BUY || !opt.buy ? UP : DOWN;
  g.beginPath(); g.moveTo(xs(0), bot);
  arr.forEach((v, i) => g.lineTo(xs(i), ys(v)));
  g.lineTo(xs(arr.length - 1), bot); g.closePath();
  const gr = g.createLinearGradient(0, top, 0, bot);
  gr.addColorStop(0, col === UP ? 'rgba(255,66,87,.35)' : 'rgba(61,139,255,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fill();
  g.beginPath(); arr.forEach((v, i) => i ? g.lineTo(xs(i), ys(v)) : g.moveTo(xs(i), ys(v)));
  g.strokeStyle = col; g.lineWidth = Math.max(3, w / 220); g.lineJoin = 'round'; g.stroke();
  const fz = Math.max(14, w / 30);

    const v = window.VOICES && window.VOICES[text];

    if (who) EVENTS.push({ t: acc + a, type: 'voice', who, text, d: b - a });
  });

function shakeAt(T) {

}

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function noiseBuf(ac) {
  if (ac._noise) return ac._noise;

}
function tone(ac, out, t, type, f0, f1, dur, peak) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.connect(env(ac, out, t, 0.008, dur * 0.4, dur * 0.6, peak)); o.start(t); o.stop(t + dur + 0.05);

}

  const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  s.connect(f); f.connect(env(ac, out, t, a, dur * 0.5, dur * 0.5, peak)); s.start(t); s.stop(t + dur + 0.05);

const VOICE = { m: { type: 'triangle', f: 330, g: 0.22 }, j: { type: 'sine', f: 210, g: 0.3 }, r: { type: 'square', f: 600, g: 0.07 } };
const SYNTH = {
  voice(ac, out, t, e) {
    const buf = VOICE_BUF[e.text];
    if (buf) { const src = ac.createBufferSource(); src.buffer = buf; src.connect(out); src.start(t); return; }
    const syl = Array.from(e.text).filter(c => /[가-힣]/.test(c));
    const step = Math.min(0.13, (e.d - 0.1) / Math.max(syl.length, 1));
    const v = VOICE[e.who];
    syl.forEach((c, i) => {
      const f = e.who === 'r' ? v.f * (i % 2 ? 1 : 1.5) : v.f * (0.85 + rnd(c.charCodeAt(0)) * 0.35);
      const end = i === syl.length - 1 ? 0.85 : 1;

  fall(ac, out, t, e) {

    o.connect(env(ac, out, t, 0.05, e.d * 0.8, e.d * 0.2, 0.25)); o.start(t); o.stop(t + e.d + 0.1); lfo.start(t); lfo.stop(t + e.d + 0.1);
  },
  rise(ac, out, t, e) {
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(1600, t + e.d);
    o.connect(env(ac, out, t, 0.05, e.d * 0.85, e.d * 0.15, 0.22)); o.start(t); o.stop(t + e.d + 0.1);
  },

  ding(ac, out, t) { tone(ac, out, t, 'sine', 1320, 1320, 1.2, 0.25); tone(ac, out, t, 'sine', 1980, 1980, 0.9, 0.12); },
  wind(ac, out, t, e) {

  gulp(ac, out, t) { tone(ac, out, t, 'sine', 220, 70, 0.18, 0.5); },

  caw(ac, out, t) {

      o.frequency.setValueAtTime(760, t + k); o.frequency.exponentialRampToValueAtTime(480, t + k + 0.3);

      o.connect(f); f.connect(env(ac, out, t + k, 0.02, 0.12, 0.18, 0.3)); o.start(t + k); o.stop(t + k + 0.4);

const voicesReady = Promise.all(Object.entries(window.VOICES || {}).map(async ([k, v]) => {
  const bin = Uint8Array.from(atob(v.src.split(',')[1]), c => c.charCodeAt(0));
  VOICE_BUF[k] = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(bin.buffer);
})).catch(() => {});

// Schedule every event at or after `from` (timeline seconds) on context `ac`, with timeline 0 mapped to `base`.
function schedule(ac, out, base, from) {
  for (const e of EVENTS) {
    if (!SYNTH[e.type]) continue;
    const longRunning = e.type === 'bgm';
    if (e.t < from - (longRunning ? e.d : 0)) continue;
    if (!longRunning && e.t < from) continue;
    SYNTH[e.type](ac, out, base + e.t, e, from);
  }
}
function master(ac) {
  const comp = ac.createDynamicsCompressor(), gn = ac.createGain();
  gn.gain.value = 0.9; gn.connect(comp); comp.connect(ac.destination); return gn;
}

// Offline render for video export (used by the MP4 render script).
window.renderAudioWav = async () => {
  const sr = 44100, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  schedule(oac, master(oac), 0, 0);
  const buf = await oac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1);
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); out.setUint32(16, 16, true);
  out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true);
  out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    out.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
    out.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true);
  }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.drawFrame = drawFrame;
window.DUR = DUR;

// ---------- player ----------
const btn = document.getElementById('play'), seek = document.getElementById('seek'), timeEl = document.getElementById('time'), sndBtn = document.getElementById('snd');
let playing = false, cur = 0, startPerf = 0, ac = null, muted = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function stopAudio() { if (ac) { ac.close(); ac = null; } }
function startAudio() {
  stopAudio();
  if (muted) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  schedule(ac, master(ac), ac.currentTime + 0.05 - cur, cur);
}
function play() {
  if (cur >= DUR - 0.05) cur = 0;
  playing = true; startPerf = performance.now() - cur * 1000; btn.textContent = '⏸ 정지';
  startAudio(); requestAnimationFrame(tick);
}
function pause() { playing = false; btn.textContent = '▶ 재생'; stopAudio(); }
function render() { drawFrame(cur); seek.value = Math.round((cur / DUR) * 1000); timeEl.textContent = `${fmt(cur)} / ${fmt(DUR)}`; }
function tick() {
  if (!playing) return;
  cur = (performance.now() - startPerf) / 1000;
  if (cur >= DUR) { cur = DUR; pause(); }
  render();
  if (playing) requestAnimationFrame(tick);
}
btn.onclick = () => (playing ? pause() : play());
cv.onclick = () => (playing ? pause() : play());
seek.oninput = () => { cur = (seek.value / 1000) * DUR; if (playing) { startPerf = performance.now() - cur * 1000; startAudio(); } render(); };
sndBtn.onclick = () => { muted = !muted; sndBtn.textContent = muted ? '🔇' : '🔊'; if (playing) startAudio(); };

window.ready = Promise.all([voicesReady, document.fonts.load(`40px 'Black Han Sans'`), document.fonts.load(`40px 'Jua'`)]).catch(() => {}).then(() => {
  cur = 1.2; render(); cur = 0;
  timeEl.textContent = `${fmt(0)} / ${fmt(DUR)}`; seek.value = 0;
});
</script>
</body>
