<script>

 ['아사나','OpenProject','GPL-3.0','일정·업무 관리, 내 서버에서','gantt',0]];

 mic:'<path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="#FF5A00" stroke-width="2" stroke-linecap="round"/>',

 cal:'<path d="M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5" fill="none" stroke="#FF5A00" stroke-width="2" stroke-linejoin="round"/>',

const ORDER=[]; SEGS.forEach(s=>{ if(!ORDER.length||ORDER[ORDER.length-1].id!==s.scene) ORDER.push({id:s.scene,t:s.start}); });
const cont=id=> id==='hook'||id==='flip'?'s_hook': id==='stars'?'s_stars': id.match(/^a\d/)?'s_app': id==='warn'?'s_warn': id.match(/^w\d/)?'s_w': id==='guide'?'s_guide':'s_cta';
const SIZE={s_hook:[920,960],s_stars:[920,960],s_app:[920,820],s_warn:[620,620],s_w:[920,680],s_guide:[860,820],s_cta:[860,760]};
const PANEL_CY=800;
const PK=ORDER.map(o=>[o.t-0.12,...SIZE[cont(o.id)],cont(o.id)==='s_warn'?310:(cont(o.id)==='s_guide'?40:44)]);
const WARN=[
 ['사양이 낮으면<br>느릴 수 있어요','<svg viewBox="0 0 24 24" width="200" height="200"><path d="M3 6h18v11H3z M1 20h22" fill="none" stroke="#FF5A00" stroke-width="1.6" stroke-linejoin="round"/></svg>','cpu'],

function subHTML(s){ return s.replace(/([A-Za-z][A-Za-z.\-]+)/g,'<span style="color:#FF5A00">$1</span>').replace(/('무료')/,'<span style="color:#FF5A00">$1</span>'); }
function seek(t){
  $('grid').style.transform=`translate(${-(t*14)%120}px,${-(t*24)%120}px)`;
  // panel morph
  const w=track(t,[[0,PK[0][1]],...PK.map(k=>[k[0],k[1]])]), h=track(t,[[0,PK[0][2]],...PK.map(k=>[k[0],k[2]])]), r=track(t,[[0,PK[0][3]],...PK.map(k=>[k[0],k[3]])]);
  const p=$('panel'); p.style.width=w+'px'; p.style.height=h+'px'; p.style.left=(540-w/2)+'px'; p.style.top=(PANEL_CY-h/2)+'px'; p.style.borderRadius=Math.min(r,w/2)+'px';

    const a=sm((since-0.06)/0.18); el.style.opacity=a; el.style.filter=a<0.98?`blur(${8*(1-a)}px)`:'none';
    el.style.left=((w-SIZE[id][0])/2)+'px'; el.style.top=((h-SIZE[id][1])/2)+'px'; });
  // hook / flip
  { const fs=ORDER.find(o=>o.id==='flip').t; PAID.forEach((x,i)=>{ const e=$('hk'+i); const a=sm((t-0.15-i*0.07)/0.2); e.style.opacity=a; e.style.transform=`translateY(${(1-S(t-0.15-i*0.07))*50}px) rotate(${t>1.2&&t<fs?Math.sin(t*40+i)*0.6:0}deg)`;
      const fl=clamp((t-fs-i*0.08)/0.25); const chip=e.querySelector('.hkchip'); const ang=fl*180;
      chip.style.transform=`rotateX(${ang>90?180-ang:ang}deg)`; if(ang>90){chip.textContent='무료 버전 있음';chip.style.background='#FF5A00';chip.style.color='#0B0B0A';e.style.borderColor='#FF5A00';} else {chip.textContent='유료 · 매달 결제';chip.style.background='#2A2927';chip.style.color='#8A877F';e.style.borderColor='#2A2927';} }); }
  // stars
  { const st=ORDER.find(o=>o.id==='stars').t; document.querySelectorAll('.st').forEach((e,i)=>{ const a=sm((t-st-i*0.03)/0.12); e.style.opacity=a; e.style.transform=`scale(${0.4+0.6*S(t-st-i*0.03,3,0.7)})`; });
    $('starn').textContent='수만 개'; $('starn').parentNode.style.opacity=sm((t-st-0.5)/0.2); }
  // app compare
  { const am=cur.id.match(/^a(\d)/); if(am){ const k=+am[1], A=APPS[k], lt=t-cur.t;
      $('anum').textContent=`0${k+1} / 07`; $('apaid').childNodes[0].nodeValue=A[0]; $('afree').textContent=A[1]; $('alic').textContent=A[2]+(A[2].includes('*')?'  일부 별도':'');
      $('afeat').innerHTML=`<svg width="56" height="56" viewBox="0 0 24 24">${ICON[A[4]]}</svg><span>${A[3]}</span>`;
      const pw=$('apaid').getBoundingClientRect().width/((parseFloat($('world')?.style?.transform)||1)); $('strike').style.width=(sm((lt-0.15)/0.3)*100)+'%';
      $('afree').style.transform=`translateY(${(1-S(lt-0.35))*60}px) scale(${0.9+0.1*S(lt-0.35)})`; $('afree').style.opacity=sm((lt-0.35)/0.15); $('afree').style.transformOrigin='left center';

  // warn items
  { const wm=cur.id.match(/^w(\d)/); if(wm){ const k=+wm[1], lt=t-cur.t; $('wnum').textContent=`주의 ${k+1} / 3`; $('wtitle').innerHTML=WARN[k][0]; $('wicon').innerHTML=WARN[k][1];
