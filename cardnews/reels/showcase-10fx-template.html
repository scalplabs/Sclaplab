<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600;800&family=Geist+Mono:wght@500;600&display=swap">
<style>
@font-face{font-family:'Pretendard';font-weight:700;src:url('FONTDIR/Pretendard-Bold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:800;src:url('FONTDIR/Pretendard-ExtraBold.woff2') format('woff2')}
html,body{margin:0;background:#0B0B0A}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0B0B0A;color:#F2F1EE;font-family:'Pretendard','Geist',sans-serif}
.mono{font-family:'Geist Mono',monospace}.g{font-family:'Geist','Pretendard',sans-serif}
.ab{position:absolute}
#grid{position:absolute;inset:-120px;background-image:linear-gradient(rgba(242,241,238,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(242,241,238,.04) 1px,transparent 1px);background-size:120px 120px}
#hud{position:absolute;left:80px;right:80px;top:150px;display:flex;justify-content:space-between;font:600 22px 'Geist Mono',monospace;letter-spacing:.14em;color:#77756F}
#sub{position:absolute;left:60px;right:60px;top:1340px;height:90px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
#foot{position:absolute;left:80px;right:80px;bottom:140px;display:flex;justify-content:space-between;font:500 22px 'Geist Mono',monospace;letter-spacing:.1em;color:#5A5854}
#scene{position:absolute;left:0;top:0;width:1080px;height:1300px}
.ph{position:absolute;overflow:hidden;border:4px solid #2A2927;background:#000}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div id="stage"><div id="grid"></div>
<div id="hud"><span>ADMAN · MADE WITH CLAUDE</span><span id="hudr"></span></div>
<div id="scene"></div><div id="sub"></div>
<div id="foot"><span>@adman_park</span><span>NO EDITING APP</span></div></div>
<script>
const SEGS=SEGS_JSON,T=TOTAL,AV='AVATAR',OR='#FF5A00';
const NAMES=NAMES_JSON;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=x=>{x=clamp(x);return x*x*(3-2*x)};
function S(t,f=2.4,z=0.84){ if(t<=0) return 0; const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
const $=id=>document.getElementById(id);
const fr=(c,t)=>`clips/c${c}/${String(1+Math.floor(clamp(t,0,2.37)*30)%72).padStart(3,'0')}.jpg`;
const loopfr=(c,t)=>`clips/c${c}/${String(1+Math.floor(t*30)%72).padStart(3,'0')}.jpg`;
function seek(t){
  $('grid').style.transform=`translate(${-(t*14)%120}px,${-(t*24)%120}px)`;
  let s=null,si=-1; SEGS.forEach((q,i)=>{ const end=i<SEGS.length-1?SEGS[i+1].start:T+5; if(t>=q.start&&t<end){s=q;si=i;} });
  const sc=$('scene'); let h='';
  const kind=s?s.scene:'intro'; const lt=s?t-s.start:t;
  if(kind==='intro'||kind==='outro'){
    // 2x5 grid of all effects playing
    const best=kind==='outro'&&s.sub.includes('5번');
    for(let i=0;i<10;i++){ const c=i%5,r=Math.floor(i/5); const a=sm((lt-0.03*i)/0.15)*1; const x=60+c*196, y=260+r*360; const hl=kind==='outro'&&(best||lt>0)&&i===4;
      h+=`<div class="ph" style="left:${x}px;top:${y}px;width:176px;height:313px;border-radius:18px;opacity:${kind==='intro'?a:1};transform:scale(${kind==='intro'?0.85+0.15*S(lt-0.03*i,3,0.7):(hl?1.06:1)});${hl?'border-color:'+OR:''}"><img src="${loopfr(i,t+i*0.2)}"></div><div class="ab g" style="left:${x+10}px;top:${y+10}px;padding:4px 12px;border-radius:999px;background:${hl?OR:'rgba(11,11,10,.8)'};color:${hl?'#0B0B0A':'#F2F1EE'};font-size:26px;font-weight:800">${i+1}</div>`; }
    if(kind==='outro'&&s.sub.includes('댓글')){ const n=Math.min(4,Math.floor((lt-0.2)/0.15)+1); h+=`<div class="ab" style="left:60px;right:60px;top:1020px;height:110px;border-radius:24px;background:#1F1E1C;display:flex;align-items:center;padding:0 34px;gap:18px;font-size:42px;font-weight:700"><span style="color:#77756F">댓글</span><span style="color:${OR}">${lt>0.2?'5 효과'.slice(0,n):''}</span></div>`; }
    if(kind==='outro'&&s.sub.includes('팔로우')){ const pr=lt>0.45; h+=`<div class="ab" style="left:60px;right:60px;top:1020px;height:110px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:20px;font-size:44px;font-weight:800;background:${pr?'#2A2927':OR};color:${pr?'#F2F1EE':'#0B0B0A'}"><img src="${AV}" style="width:64px;height:64px;border-radius:32px;image-rendering:pixelated">${pr?'팔로잉 ✓':'애드맨 팔로우'}</div>`; }
    if(kind==='outro'&&s.sub.includes('프롬프트')){ const dm=sm((lt-0.1)/0.2); h+=`<div class="ab" style="left:60px;right:60px;top:1020px;height:110px;border-radius:24px;background:${OR};color:#0B0B0A;display:flex;align-items:center;gap:20px;padding:0 34px;font-size:42px;font-weight:800;opacity:${dm}">📩 만드는 프롬프트 DM 도착</div>`; }
    $('hudr').textContent=kind==='intro'?'10 EFFECTS':'PICK ONE';
  } else {
    const k=+kind.slice(2); const z=0.92+0.08*S(lt,2.6,0.75);
    h+=`<div class="ph" style="left:${540-290*z}px;top:${250+(1-z)*200}px;width:${580*z}px;height:${1031*z}px;border-radius:40px;border-color:#3A3936"><img src="${fr(k,lt)}"></div>`;
    const q=sm(lt/0.12); h+=`<div class="ab g" style="left:40px;top:220px;font-size:200px;font-weight:800;letter-spacing:-.06em;color:${OR};opacity:${q};transform:translateX(${(1-S(lt,3,0.7))*-80}px);text-shadow:0 8px 30px rgba(0,0,0,.6)">${String(k+1).padStart(2,'0')}</div>`;
    let dots=''; for(let i=0;i<10;i++) dots+=`<i style="display:block;width:${i===k?40:12}px;height:12px;border-radius:6px;background:${i<=k?OR:'#2A2927'}"></i>`;
    h+=`<div class="ab" style="left:0;right:0;top:1300px;display:flex;justify-content:center;gap:10px">${dots}</div>`;
    $('hudr').textContent=`${String(k+1).padStart(2,'0')} / 10 · ${NAMES[k]}`;
  }
  sc.innerHTML=h;
  const el=$('sub'); if(!s){el.innerHTML='';} else { let est=0; for(const ch of s.sub){ est+=/[가-힣]/.test(ch)?0.95:(ch===' '?0.28:0.58);} el.style.fontSize=Math.min(74,Math.floor(960/est))+'px'; el.innerHTML='<span>'+s.sub.replace(/(\d+번|10개|'효과')/g,`<span style="color:${OR}">$1</span>`)+'</span>'; el.style.opacity=clamp((t-s.start)/0.08); el.style.top=(kind.startsWith('fx')?1360:1340)+'px'; }
}
window.seek=seek; seek(0);
</script></body></html>
