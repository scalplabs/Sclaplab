<script>
const SEGS=SEGS_JSON, T=TOTAL, AV='AVATAR';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), sm=x=>{x=clamp(x);return x*x*(3-2*x)};
function S(t,f=2.4,z=0.84){ if(t<=0) return 0; const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function track(t,k,f,z){ let v=k[0][1]; for(let i=1;i<k.length;i++) v+=(k[i][1]-k[i-1][1])*S(t-k[i][0],f,z); return v; }
const $=id=>document.getElementById(id);
const OR='#FF5A00';
const ORDER=[]; SEGS.forEach(s=>{ if(!ORDER.length||ORDER[ORDER.length-1].id!==s.scene) ORDER.push({id:s.scene,t:s.start}); });
const segsOf=id=>SEGS.filter(s=>s.scene===id);
const SIZE={docs:[920,960,40],same:[920,960,40],steps:[920,820,40],copy:[920,820,40],dissect:[620,960,60],r0:[920,620,40],r1:[920,620,40],r2:[920,620,40],r3:[920,620,40],grid:[920,960,40],hooks:[920,960,40],fake:[760,700,40],fact:[920,700,40],guide:[860,820,40],cta:[860,760,40]};

const pop=(lt,a,d=0.18)=>({o:sm((lt-a)/0.08),s:0.86+0.14*S(lt-a,3,0.7)});

    const q=pop(lt,at(1)+0.1); h+=`<div class="ab" style="left:110px;right:110px;bottom:40px;text-align:center;font-size:40px;font-weight:800;color:${OR};opacity:${q.o}">순서 말고 '기준'</div>`; return h; }

    h+=box(60,420,800,150,`<div class="ab" style="left:34px;top:46px;font-size:48px;font-weight:800;opacity:${0.3+0.7*b}">둘째 줄도 보게 됨</div>`); return h; }
  if(id==='r1'){ let h=`<div class="lbl ab" style="left:60px;top:56px">기준 2 · 예시</div>`; const k=sm((lt-0.5)/0.25);

    h+=`<div class="ab g" style="left:60px;top:200px;font-size:200px;font-weight:800;color:${OR};opacity:${k};transform:scale(${0.8+0.2*S(lt-0.5,3,0.6)});transform-origin:left">37%</div>`;
    h+=`<div class="ab" style="left:60px;bottom:70px;font-size:40px;font-weight:700;color:#8A877F">막연한 말 → 숫자</div>`; return h; }
  if(id==='r2'){ let h=`<div class="lbl ab" style="left:60px;top:56px">기준 3</div>`; const n=Math.min(6,Math.floor(lt/0.08));

    const d=pop(lt,at(3)+0.2); h+=box(250,250,420,420,`<div class="mono" style="padding:34px;font-size:22px;color:${OR}">PROMPT.md</div><div style="padding:0 34px;font-size:46px;font-weight:800">대본 원칙<br>프롬프트 1장</div><div style="padding:0 34px">${lines(4)}</div>`,`opacity:${d.o};transform:scale(${d.s});border-color:${OR};background:#161615`);

  if(id==='hooks'){ let h=''; const n=Math.min(9,Math.floor((lt-0.05)/0.09)); h+=box(60,60,800,110,`<div class="ab" style="left:30px;top:30px;font-size:40px;font-weight:800">${'주제: 내 소재'.slice(0,Math.max(0,Math.floor((lt-at(1))/0.08)))}</div>`);
    const sc=[9.4,9.1,8.8,8.6,8.3,8.1,7.9,7.6,7.2,6.8];
    for(let i=0;i<10;i++){ const q=pop(lt,at(2)+i*0.08); const x=60+(i%2)*410, y=200+Math.floor(i/2)*140; const scoreOn=lt>=at(3)+i*0.06;
      h+=box(x,y,390,120,`<div class="ab mono" style="left:24px;top:22px;font-size:20px;color:#77756F">HOOK ${String(i+1).padStart(2,'0')}</div><div class="ab" style="left:24px;top:58px;right:120px">${lines(1,[90])}</div><div class="ab g" style="right:24px;top:34px;font-size:44px;font-weight:800;color:${i<3?OR:'#F2F1EE'};opacity:${scoreOn?1:0}">${sc[i].toFixed(1)}</div>`,`opacity:${q.o};transform:scale(${q.s});${i<3&&scoreOn?'border-color:'+OR:''}`); }

function subHTML(s){ return s.replace(/(159개|10개|'대본')/g,`<span style="color:${OR}">$1</span>`); }
function seek(t){

  const sc=$('scene'); const since=t-(cur.t-0.12), a=sm((since-0.06)/0.18);
