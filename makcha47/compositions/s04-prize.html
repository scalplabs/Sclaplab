  <div id="root" data-composition-id="s04-prize" data-width="1080" data-height="1920">
    <!-- 캔버스 그림(hosted): assets/makcha-engine.js 의 "board" 장면 -->
    <canvas id="s04-cv" width="1080" height="1920" data-layout-allow-overflow></canvas>
    <!-- 숫자판 글자: Studio 에서 직접 고칠 수 있다. 상금은 data-from → data-to 로 올라간다. -->
    <p id="s04-count" class="clip s04-line" data-start="0" data-duration="3.96" data-track-index="2">100</p>
    <p id="s04-count-label" class="clip s04-line" data-start="0" data-duration="3.96" data-track-index="3">남은 참가자</p>
    <p id="s04-pool" class="clip s04-line" data-start="0" data-duration="3.96" data-track-index="4" data-prefix="₩" data-from="0" data-to="100000000" data-count-at="1.4" data-count-for="1.2">₩0</p>
    <p id="s04-rate" class="clip s04-line" data-start="2.6" data-duration="1.36" data-track-index="5">+ ₩100,000,000 / 1명</p>
  </div>
  <script>
    (function () {
      var ID = "s04-prize";
      function build() {
        var tl = gsap.timeline({ paused: true });
        // start = 영상 전체에서 이 장면이 시작하는 초 (index.html 의 data-start 와 같게), dur = 장면 길이
        window.Makcha.mount(document.getElementById("s04-cv"), "board", tl, { start: 16.28, dur: 3.96 });
        // 상금 카운트업 (0 → 1억)
        var pool = document.getElementById("s04-pool");
        var v = { n: Number(pool.dataset.from) };
        var show = function () {
          pool.textContent = pool.dataset.prefix + Math.round(v.n).toLocaleString("en-US");
        };
        tl.fromTo(
          v,
          { n: Number(pool.dataset.from) },
          { n: Number(pool.dataset.to), duration: Number(pool.dataset.countFor), ease: "power2.out", onUpdate: show },
          Number(pool.dataset.countAt),
        );
        show();
        window.__timelines[ID] = tl;
      }
      function start() {
        window.Makcha.ready.then(build);
      }
      window.__timelines = window.__timelines || {};
      if (window.Makcha) start();
      else {
        // 이 장면만 따로 열었을 때: 그림 엔진을 직접 불러온다
        var s = document.createElement("script");
        s.src = "assets/makcha-engine.js";
        s.onload = start;
        document.head.appendChild(s);
      }
    })();
  </script>
