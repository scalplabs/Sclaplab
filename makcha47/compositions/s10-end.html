<!-- 장면 10. 엔딩: 댓글 입력 → 로고 (40.13s ~ 44.33s) -->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    #s10-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="s10-end" data-width="1080" data-height="1920">
    <!-- 캔버스 그림(hosted): assets/makcha-engine.js 의 "end" 장면. data-* 값은 화면 속 글자/타이밍 -->
    <canvas id="s10-cv" width="1080" height="1920" data-layout-allow-overflow data-logo-at="2.4" data-question="너라면 뭐 할래?" data-sub="댓글에 너의 선택을 적어줘" data-placeholder="댓글 달기..." data-typed="나라면 B. 혼자 간다" data-cta="댓글 1등이 PART 2를 정한다" data-left="99" data-title="막차 47" data-part="PART 1 · 네가 정해" data-like="좋아요" data-follow="팔로우"></canvas>
  </div>
  <script>
    (function () {
      var ID = "s10-end";
      function build() {
        var tl = gsap.timeline({ paused: true });
        // start = 영상 전체에서 이 장면이 시작하는 초 (index.html 의 data-start 와 같게), dur = 장면 길이
        window.Makcha.mount(document.getElementById("s10-cv"), "end", tl, { start: 40.13, dur: 4.2 });
        window.__timelines[ID] = tl;
      }
      function start() {
        window.Makcha.ready.then(build);
      }
      window.__timelines = window.__timelines || {};
      if (window.Makcha) start();
      else {
        // 이 장면만 따로 열었을 때: 그림 엔진을 직접 불러온다
        var s = document.createElement("script");
        s.src = "assets/makcha-engine.js";
        s.onload = start;
        document.head.appendChild(s);
      }
    })();
  </script>
</template>
