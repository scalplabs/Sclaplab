<!-- 장면 9. 선택지 A / B (36.41s ~ 40.13s) -->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    #s09-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="s09-choice" data-width="1080" data-height="1920">
    <!-- 캔버스 그림(hosted): assets/makcha-engine.js 의 "choice" 장면. data-* 값은 화면 속 글자/타이밍 -->
    <canvas id="s09-cv" width="1080" height="1920" data-layout-allow-overflow data-choice-a="12번을 따라간다" data-choice-b="혼자 움직인다"></canvas>
  </div>
  <script>
    (function () {
      var ID = "s09-choice";
      function build() {
        var tl = gsap.timeline({ paused: true });
        // start = 영상 전체에서 이 장면이 시작하는 초 (index.html 의 data-start 와 같게), dur = 장면 길이
        window.Makcha.mount(document.getElementById("s09-cv"), "choice", tl, { start: 36.41, dur: 3.72 });
        window.__timelines[ID] = tl;
      }
      function start() {
        window.Makcha.ready.then(build);
      }
      window.__timelines = window.__timelines || {};
      if (window.Makcha) start();
      else {
        // 이 장면만 따로 열었을 때: 그림 엔진을 직접 불러온다
        var s = document.createElement("script");
        s.src = "assets/makcha-engine.js";
        s.onload = start;
        document.head.appendChild(s);
      }
    })();
  </script>
</template>
