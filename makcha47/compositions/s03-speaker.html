<!-- 장면 3. 안내방송 스피커 (8.81s ~ 16.28s) -->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    #s03-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="s03-speaker" data-width="1080" data-height="1920">
    <!-- 캔버스 그림(hosted): assets/makcha-engine.js 의 "speaker" 장면 -->
    <canvas id="s03-cv" width="1080" height="1920" data-layout-allow-overflow></canvas>
  </div>
  <script>
    (function () {
      var ID = "s03-speaker";
      function build() {
        var tl = gsap.timeline({ paused: true });
        // start = 영상 전체에서 이 장면이 시작하는 초 (index.html 의 data-start 와 같게), dur = 장면 길이
        window.Makcha.mount(document.getElementById("s03-cv"), "speaker", tl, { start: 8.81, dur: 7.47 });
        window.__timelines[ID] = tl;
      }
      function start() {
        window.Makcha.ready.then(build);
      }
      window.__timelines = window.__timelines || {};
      if (window.Makcha) start();
      else {
        // 이 장면만 따로 열었을 때: 그림 엔진을 직접 불러온다
        var s = document.createElement("script");
        s.src = "assets/makcha-engine.js";
        s.onload = start;
        document.head.appendChild(s);
      }
    })();
  </script>
</template>
