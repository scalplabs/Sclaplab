<!-- 장면 1. 휴대폰 문자 (0s ~ 4s) -->
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    #s01-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="s01-phone" data-width="1080" data-height="1920">
    <!-- 캔버스 그림(hosted): assets/makcha-engine.js 의 "phone" 장면. data-* 값은 화면 속 글자/타이밍 -->
    <canvas id="s01-cv" width="1080" height="1920" data-layout-allow-overflow data-clock="2:04" data-sender="알 수 없음" data-message="축하합니다,|참가자 47번.|당신은 선택되었습니다."></canvas>
  </div>
  <script>
    (function () {
      var ID = "s01-phone";
      function build() {
        var tl = gsap.timeline({ paused: true });
        // start = 영상 전체에서 이 장면이 시작하는 초 (index.html 의 data-start 와 같게), dur = 장면 길이
        window.Makcha.mount(document.getElementById("s01-cv"), "phone", tl, { start: 0, dur: 4 });
        window.__timelines[ID] = tl;
      }
      function start() {
        window.Makcha.ready.then(build);
      }
      window.__timelines = window.__timelines || {};
      if (window.Makcha) start();
      else {
        // 이 장면만 따로 열었을 때: 그림 엔진을 직접 불러온다
        var s = document.createElement("script");
        s.src = "assets/makcha-engine.js";
        s.onload = start;
        document.head.appendChild(s);
      }
    })();
  </script>
</template>
