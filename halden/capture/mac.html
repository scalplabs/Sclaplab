<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halden — Mac Frame</title>
<style>
@font-face{font-family:"Inter";src:url(../fonts/inter.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05060a}
body{font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#f2f2f7}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.wall{position:absolute;inset:0;
  background:
    radial-gradient(60% 70% at 18% 92%,rgba(255,122,48,.55),transparent 60%),
    radial-gradient(55% 60% at 88% 12%,rgba(86,92,190,.55),transparent 62%),
    radial-gradient(40% 50% at 70% 85%,rgba(196,72,92,.35),transparent 60%),
    linear-gradient(160deg,#141a2e 0%,#0b0d16 55%,#120b0a 100%)}
.menubar{position:absolute;left:0;right:0;top:0;height:25px;display:flex;align-items:center;gap:20px;padding:0 18px;
  font-size:13px;font-weight:500;background:rgba(18,18,24,.38);backdrop-filter:blur(30px) saturate(1.6);color:rgba(255,255,255,.92)}
.menubar .app{font-weight:700}
.menubar .right{margin-left:auto;display:flex;gap:16px;align-items:center}
.menubar svg{display:block}
.window{position:absolute;left:160px;top:76px;width:1600px;height:952px;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(255,255,255,.16),0 28px 70px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.4);background:#000}
.toolbar{height:52px;display:flex;align-items:center;background:#1f1f22;border-bottom:1px solid #000;padding:0 16px;position:relative}
.lights{display:flex;gap:8px;margin-right:22px}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb{display:flex;gap:18px;align-items:center;color:#8e8e93}
.url{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:560px;height:32px;border-radius:8px;background:#2c2c2f;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;color:#e8e8ed;letter-spacing:.01em}
.url .reload{position:absolute;right:10px;color:#8e8e93}
.url .bar{position:absolute;left:0;bottom:0;height:2px;background:#0a84ff;border-radius:2px;width:0}
.tb.right{margin-left:auto}
iframe{display:block;width:1600px;height:900px;border:0;background:#0d0c0a}
</style>
</head>
<body>
<div id="stage">
  <div class="wall"></div>
  <div class="menubar">
    <span class="app">Safari</span><span>File</span><span>Edit</span><span>View</span><span>History</span><span>Bookmarks</span><span>Window</span><span>Help</span>
    <span class="right">
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="20" height="11" rx="3"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M22.5 4v4" stroke-linecap="round"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5ZM3.4 6.8a6.6 6.6 0 0 1 9.2 0l-1.1 1.1a5 5 0 0 0-7 0L3.4 6.8ZM1.1 4.5a9.9 9.9 0 0 1 13.8 0l-1.1 1.1a8.3 8.3 0 0 0-11.6 0L1.1 4.5Z"/></svg>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="4.5"/><path d="m9.5 9.5 3.5 3.5" stroke-linecap="round"/></svg>
      <span>Fri 23 Oct&nbsp;&nbsp;6:42 PM</span>
    </span>
  </div>
  <div class="window">
    <div class="toolbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="tb">
        <svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x=".7" y=".7" width="18.6" height="14.6" rx="3"/><path d="M7 1v14"/></svg>
        <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 2 8l6 6"/></svg>
        <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="#4a4a4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 6 6-6 6"/></svg>
      </div>
      <div class="url">
        <svg width="10" height="13" viewBox="0 0 10 13" fill="currentColor" opacity=".75"><rect x="0" y="5.5" width="10" height="7.5" rx="1.6"/><path d="M2.4 5.5V4a2.6 2.6 0 0 1 5.2 0v1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span>halden.studio</span>
        <svg class="reload" width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M11 6.5A4.5 4.5 0 1 1 9.4 3"/><path d="M9.6.9v2.4H7.2"/></svg>
        <span class="bar" id="bar"></span>
      </div>
      <div class="tb right">
        <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V1.5M4.5 4.5 8 1l3.5 3.5"/><path d="M5 7H2.5v10h11V7H11"/></svg>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>
        <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4.7" y=".7" width="12.6" height="10.6" rx="2"/><path d="M2.5 4v9.3c0 1 .8 1.9 1.9 1.9h9.1"/></svg>
      </div>
    </div>
    <iframe id="site" src="../index.html"></iframe>
  </div>
</div>
<script>
  const stage = document.getElementById('stage');
  // camera: scale s about focus point (fx, fy) in stage coordinates
  window.__cam = (s, fx, fy) => {
    stage.style.transform = `translate(${fx * (1 - s)}px,${fy * (1 - s)}px) scale(${s})`;
  };
  window.__bar = p => { const b = document.getElementById('bar'); b.style.width = (p * 100) + '%'; b.style.opacity = p >= 1 ? 0 : 1; };
</script>
</body>
</html>
