<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Human Lab</title>
<style>
:root{--bg:#0d0f12;--panel:rgba(18,21,26,.86);--line:#262b33;--fg:#e7eaf0;--muted:#8b93a1;--acc:#7cc4ff;--ok:#5fd38d;--warn:#ffb454;--err:#ff6b6b;
  --f:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 var(--f);overflow:hidden}
#view{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;backdrop-filter:blur(6px)}
#top b{font-weight:650;letter-spacing:.02em}
#top .stat{font-family:var(--mono);color:var(--muted);font-size:12px}
#top .stat i{font-style:normal;color:var(--fg)}
#top .sp{flex:1}
.pill{border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;background:transparent;color:var(--fg);font:inherit}
.pill.on{border-color:var(--acc);color:var(--acc)}
#gui{position:fixed;top:48px;right:8px;bottom:182px;overflow:auto;z-index:4}
#dock{position:fixed;left:0;right:0;bottom:0;height:174px;background:var(--panel);border-top:1px solid var(--line);z-index:5;display:grid;grid-template-columns:1fr 330px;gap:0}
#dlg{padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
#dlg .row{display:flex;gap:8px;align-items:center}
#say{flex:1;min-width:0;background:#0a0c0f;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 11px;font:14px var(--f)}
button.b{background:#1b2028;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;white-space:nowrap}
button.b:hover{border-color:var(--acc)}
button.b.pri{background:#1f3a52;border-color:#2e5c80}
select{background:#0a0c0f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px}
#tl{width:100%;height:54px;background:#0a0c0f;border:1px solid var(--line);border-radius:8px}
#log{font-family:var(--mono);font-size:11.5px;color:var(--muted);height:30px;overflow:auto;white-space:pre-wrap}
#state{border-left:1px solid var(--line);padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:auto;white-space:pre}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);font-size:15px;color:var(--muted)}
#hint{position:fixed;left:12px;top:50px;z-index:4;color:var(--muted);font-size:12px;max-width:360px}
@media (max-width:760px){#dock{grid-template-columns:1fr;height:210px}#state{display:none}#gui{bottom:216px;max-width:62vw}}
</style>
</head>
<body>
<div id="view"></div>
<div id="top">
  <b>Digital Human Lab</b><span class="stat">Kim Min-jun · 180 cm</span>
  <span class="sp"></span>
  <span class="stat">FPS <i id="fps">–</i></span><span class="stat">frame <i id="ms">–</i> ms</span>
  <span class="stat">draw <i id="dc">–</i></span><span class="stat">tris <i id="tri">–</i></span><span class="stat">heap <i id="mem">–</i></span>
  <button class="pill" id="qbtn">HQ</button><button class="pill" id="abtn">Manual</button>
</div>
<div id="hint">드래그: 360° 회전 · 휠: 줌 · 바닥 Shift+클릭: 그 위치로 걷기 · 오른쪽 패널: 모든 제어</div>
<div id="gui"></div>
<div id="dock">
  <div id="dlg">
    <div class="row">
      <input id="say" placeholder="대사를 입력하세요 (한국어 / English)…" value="안녕하세요. 저는 김민준이에요. 만나서 정말 반가워요.">
      <select id="lang"><option value="">auto</option><option value="ko">한국어</option><option value="en">English</option></select>
      <button class="b pri" id="speak">말하기</button><button class="b" id="conv">대화(AI)</button><button class="b" id="listen">듣기</button>
    </div>
    <canvas id="tl" width="1200" height="54"></canvas>
    <div id="log"></div>
  </div>
  <div id="state"></div>
</div>
<div id="loading">디지털 휴먼 로딩 중…</div>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/jsm/"}}</script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
