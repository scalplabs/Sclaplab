<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>완벽한 범죄 수업</title>
<style>
@font-face{font-family:Jua;src:url(fonts/Jua.ttf)}
@font-face{font-family:BHS;src:url(fonts/BlackHanSans.ttf)}
:root{--bg:#0d0b14;--fg:#f3eefc}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Jua,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;box-sizing:border-box;min-height:100vh}
canvas{width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;border-radius:8px}
button{font:inherit;font-size:18px;padding:8px 22px;border-radius:999px;border:0;background:#ff7eb6;color:#2a0d1c;cursor:pointer}
body.render{padding:0;gap:0}
body.render canvas{width:1280px;height:720px;border-radius:0}
body.render button{display:none}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<button id="play">▶ 재생</button>
<audio id="bgm" preload="auto"></audio>
<script src="episodes.js"></script>
<script>
const W = 1280, H = 720, DUR = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let T = 0; // current time, shared with draw helpers

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const backOut = t => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ---------- script ----------
const TEACHER = '선생님';
const EP_NUM = +(new URLSearchParams(location.search).get('ep') || 1);
const EP = EPISODES[EP_NUM];
const LINES = EP.lines.map(l => ({ ...l, col: SPEAKER_COLORS[l.who], speak: l.speak || 0.6 }));
const BLEEP = '(삐-)';
const SPOKEN = /[가-힣A-Za-z0-9]/;
function talk(who, t) {
  for (const l of LINES) {
    const span = (l.e - l.s) * l.speak;
    if (l.who !== who || t < l.s || t >= l.s + span) continue;
    const f = (t - l.s) / span * l.text.length, i = Math.floor(f);
    const b = l.text.indexOf(BLEEP);
    if (b >= 0 && i >= b && i < b + BLEEP.length) return 0.85;
    return SPOKEN.test(l.text[i] || '') ? 0.2 + 0.8 * Math.sin(Math.PI * (f - i)) : 0;
  }
  return 0;
}
function blinkAt(t, phase) { const p = (t + phase) % 3.7; return p < 0.12 ? Math.sin(p / 0.12 * Math.PI) : 0; }

// ---------- characters ----------
const CAST = {
  teacher: { skin: '#ffe2cc', hair: '#262636', hairHi: '#4a4a66', eye: '#6b4a32', style: 'messy', glasses: 'rect', outfit: 'teacher' },
  hana:    { skin: '#ffe6d6', hair: '#f48fb1', hairHi: '#ffc4d8', eye: '#d6336c', style: 'pony', outfit: 'girl', blush: .45, ahoge: true },
  minjun:  { skin: '#ffe4d0', hair: '#34477d', hairHi: '#5b73b8', eye: '#2f7fd8', style: 'short', glasses: 'round', outfit: 'boy', blush: .2 },
  taeo:    { skin: '#ffdcc2', hair: '#e8b244', hairHi: '#ffe08a', eye: '#3fa34d', style: 'messy', outfit: 'boy', blush: .15 },
};
const INK = '#4a2c2a';

function facePath(c) {
  c.beginPath();
  c.moveTo(-92, -30);
  c.bezierCurveTo(-92, 50, -48, 108, 0, 128);
  c.bezierCurveTo(48, 108, 92, 50, 92, -30);
  c.bezierCurveTo(92, -132, -92, -132, -92, -30);
  c.closePath();
}

function drawBody(c, o, pose) {
  const blazer = o.outfit === 'girl' ? '#2d3a66' : '#283456';
  if (o.outfit === 'teacher') {
    // shirt
    c.fillStyle = '#f4f6fb';
    c.beginPath(); c.moveTo(-40, 140); c.bezierCurveTo(-130, 150, -195, 180, -215, 300); c.lineTo(-235, 560); c.lineTo(235, 560); c.lineTo(215, 300); c.bezierCurveTo(195, 180, 130, 150, 40, 140); c.fill();
    c.strokeStyle = '#c6cad8'; c.lineWidth = 4; c.stroke();
    // vest
    c.fillStyle = '#3b3f52';
    c.beginPath(); c.moveTo(-95, 170); c.lineTo(-150, 560); c.lineTo(150, 560); c.lineTo(95, 170); c.lineTo(0, 330); c.closePath(); c.fill();
    c.fillStyle = '#d7dbe6'; [380, 440, 500].forEach(y => { c.beginPath(); c.arc(0, y, 6, 0, 7); c.fill(); });
    // collar
    c.fillStyle = '#ffffff';
    c.beginPath(); c.moveTo(-40, 135); c.lineTo(-70, 190); c.lineTo(-8, 170); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(40, 135); c.lineTo(70, 190); c.lineTo(8, 170); c.closePath(); c.fill();
    // loose red tie
    c.fillStyle = '#d6404e';
    c.beginPath(); c.moveTo(-14, 172); c.lineTo(14, 172); c.lineTo(9, 196); c.lineTo(-9, 196); c.fill();
    c.beginPath(); c.moveTo(-9, 196); c.lineTo(9, 196); c.lineTo(26, 320); c.lineTo(4, 345); c.lineTo(-14, 318); c.fill();
    return;
  }
  c.fillStyle = blazer;
  c.beginPath(); c.moveTo(-40, 140); c.bezierCurveTo(-130, 150, -195, 180, -215, 300); c.lineTo(-235, 560); c.lineTo(235, 560); c.lineTo(215, 300); c.bezierCurveTo(195, 180, 130, 150, 40, 140); c.fill();
  // shirt V
  c.fillStyle = '#f6f7fb';
  c.beginPath(); c.moveTo(-42, 138); c.lineTo(42, 138); c.lineTo(0, 290); c.closePath(); c.fill();
  // lapels
  c.fillStyle = '#1d2747';
  c.beginPath(); c.moveTo(-44, 140); c.lineTo(-90, 180); c.lineTo(-30, 330); c.lineTo(0, 292); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(44, 140); c.lineTo(90, 180); c.lineTo(30, 330); c.lineTo(0, 292); c.closePath(); c.fill();
  // emblem
  c.fillStyle = '#f2c14e'; c.beginPath(); c.arc(-120, 300, 14, 0, 7); c.fill();
  if (o.outfit === 'girl') {
    c.fillStyle = '#e0344f';
    c.beginPath(); c.moveTo(0, 178); c.lineTo(-48, 152); c.lineTo(-44, 206); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(0, 178); c.lineTo(48, 152); c.lineTo(44, 206); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-6, 180); c.lineTo(-22, 240); c.lineTo(-6, 232); c.fill();
    c.beginPath(); c.moveTo(6, 180); c.lineTo(22, 240); c.lineTo(6, 232); c.fill();
    c.fillStyle = '#b81f3a'; c.beginPath(); c.arc(0, 178, 11, 0, 7); c.fill();
  } else {
    c.fillStyle = '#2f6fd1';
    c.beginPath(); c.moveTo(-12, 160); c.lineTo(12, 160); c.lineTo(8, 184); c.lineTo(-8, 184); c.fill();
    c.beginPath(); c.moveTo(-8, 184); c.lineTo(8, 184); c.lineTo(20, 290); c.lineTo(0, 300); c.lineTo(-20, 290); c.fill();
    c.strokeStyle = '#9ec1ff'; c.lineWidth = 4;
    for (let y = 200; y < 290; y += 26) { c.beginPath(); c.moveTo(-12, y + 6); c.lineTo(12, y - 6); c.stroke(); }
  }
}

function drawArm(c, sx, sy, hx, hy, sleeve, skin, cuff) {
  c.lineCap = 'round';
  c.strokeStyle = sleeve; c.lineWidth = 72;
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(hx, hy); c.stroke();
  const a = Math.atan2(hy - sy, hx - sx);
  c.strokeStyle = cuff; c.lineWidth = 60;
  c.beginPath(); c.moveTo(hx - Math.cos(a) * 30, hy - Math.sin(a) * 30); c.lineTo(hx - Math.cos(a) * 18, hy - Math.sin(a) * 18); c.stroke();
  c.save(); c.translate(hx + Math.cos(a) * 20, hy + Math.sin(a) * 20); c.rotate(a + Math.PI / 2);
  c.fillStyle = skin; c.strokeStyle = INK; c.lineWidth = 3;
  c.beginPath(); c.ellipse(0, 0, 30, 34, 0, 0, 7); c.fill(); c.stroke();
  for (let i = -1; i <= 2; i++) { c.beginPath(); c.ellipse(i * 13 - 4, -34, 7, 18, 0, 0, 7); c.fill(); c.stroke(); }
  c.restore();
}

function drawHead(c, o, st) {
  // st: mouth, blink, expr, lookX, glint, shadow
  const expr = st.expr || 'normal';
  // back hair
  c.fillStyle = o.hair;
  if (o.style === 'pony') {
    c.save(); c.translate(78, -96); c.rotate(0.55 + Math.sin(T * 3.2) * 0.1);
    c.beginPath(); c.moveTo(-10, 0); c.bezierCurveTo(90, 10, 110, 150, 50, 250); c.bezierCurveTo(50, 160, 0, 90, -34, 30); c.closePath(); c.fill();
    c.restore();
    c.beginPath(); c.moveTo(-104, -30); c.lineTo(-112, 70); c.quadraticCurveTo(-90, 110, -70, 80); c.lineTo(70, 80); c.quadraticCurveTo(90, 110, 112, 70); c.lineTo(104, -30); c.fill();
  }
  c.beginPath(); c.ellipse(0, -36, 106, 110, 0, 0, 7); c.fill();
  // neck + ears
  c.fillStyle = '#f2c9b0'; c.fillRect(-30, 88, 60, 70);
  c.fillStyle = o.skin; c.strokeStyle = INK; c.lineWidth = 3;
  [-1, 1].forEach(sd => { c.beginPath(); c.ellipse(sd * 92, 12, 14, 24, 0, 0, 7); c.fill(); c.stroke(); });
  // face
  facePath(c); c.fillStyle = o.skin; c.fill(); c.strokeStyle = INK; c.lineWidth = 3.5; c.stroke();
  // blush
  const bl = (o.blush || 0) + (st.blush || 0);
  if (bl > 0) {
    c.fillStyle = `rgba(255,110,140,${bl})`;
    [-1, 1].forEach(sd => { c.beginPath(); c.ellipse(sd * 56, 62, 20, 9, 0, 0, 7); c.fill(); });
  }
  // eyes
  const glint = st.glint || 0;
  [-1, 1].forEach(sd => {
    c.save(); c.translate(sd * 40 + (st.lookX || 0) * 6, 20);
    let open = 1 - (st.blink || 0);
    if (expr === 'sleepy') open *= 0.32;
    if (expr === 'smug') open *= 0.62;
    if (expr === 'dead') open *= 0.5;
    if (open < 0.14) {
      c.strokeStyle = INK; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-24, 4); c.quadraticCurveTo(0, 14, 24, 4); c.stroke();
    } else {
      c.translate(0, (1 - open) * 14); c.scale(1, open);
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, 2, 25, 30, 0, 0, 7); c.fill();
      if (expr === 'shock') {
        c.fillStyle = o.eye; c.beginPath(); c.ellipse(0, 2, 7, 9, 0, 0, 7); c.fill();
      } else if (expr === 'dead') {
        // flat, highlight-less eyes
        c.fillStyle = '#3a2030'; c.beginPath(); c.ellipse(0, 6, 18, 25, 0, 0, 7); c.fill();
      } else {
        const g = c.createLinearGradient(0, -22, 0, 30); g.addColorStop(0, '#1c1020'); g.addColorStop(1, o.eye);
        c.fillStyle = g; c.beginPath(); c.ellipse(0, 6, 18, 25, 0, 0, 7); c.fill();
        c.fillStyle = '#140a14'; c.beginPath(); c.ellipse(0, 6, 8, 13, 0, 0, 7); c.fill();
        c.fillStyle = 'rgba(255,255,255,.95)'; c.beginPath(); c.arc(-7, -6, 7, 0, 7); c.fill();
        c.beginPath(); c.arc(7, 16, 3.5, 0, 7); c.fill();
      }
      c.strokeStyle = '#1e1218'; c.lineWidth = 7; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-28, -18); c.quadraticCurveTo(0, -38, 28, -20); c.stroke();
      c.beginPath(); c.moveTo(sd * 26, -20); c.lineTo(sd * 36, -28); c.stroke();
    }
    c.restore();
    // brows
    c.save(); c.strokeStyle = o.hair === '#e8b244' ? '#a8761c' : '#2a1a22'; c.lineWidth = 5; c.lineCap = 'round';
    c.beginPath();
    if (expr === 'nervous') { c.moveTo(sd * 18, -30); c.lineTo(sd * 58, -20); }
    else if (expr === 'smug') { c.moveTo(sd * 18, -18); c.lineTo(sd * 58, -26); }
    else if (expr === 'angry') { c.moveTo(sd * 16, -14); c.lineTo(sd * 60, -36); }
    else if (expr === 'dead') { c.moveTo(sd * 18, -22); c.lineTo(sd * 60, -22); }
    else if (expr === 'shock') { c.moveTo(sd * 20, -42); c.quadraticCurveTo(sd * 40, -50, sd * 60, -40); }
    else { c.moveTo(sd * 18, -28); c.quadraticCurveTo(sd * 40, -36, sd * 60, -28); }
    c.stroke(); c.restore();
  });
  // nose
  c.strokeStyle = '#d99a84'; c.lineWidth = 3; c.beginPath(); c.moveTo(4, 56); c.lineTo(0, 64); c.stroke();
  // mouth
  const m = st.mouth || 0;
  c.save(); c.translate(0, 88);
  if (expr === 'shock') {
    c.fillStyle = '#6a1f2a'; c.beginPath(); c.ellipse(0, 4, 10, 14, 0, 0, 7); c.fill();
  } else if (m > 0.05) {
    c.fillStyle = '#7a2632'; c.beginPath(); c.ellipse(0, 2, 10 + 5 * m, 3 + 12 * m, 0, 0, 7); c.fill();
    c.fillStyle = '#ff8a9a'; c.beginPath(); c.ellipse(0, 4 + 8 * m, 6 + 2 * m, 3 * m, 0, 0, 7); c.fill();
  } else {
    c.strokeStyle = INK; c.lineWidth = 3.5; c.lineCap = 'round'; c.beginPath();
    if (expr === 'smug') { c.moveTo(-14, 0); c.quadraticCurveTo(4, 6, 16, -6); }
    else if (expr === 'dead') { c.moveTo(-12, 0); c.lineTo(12, 0); }
    else if (expr === 'angry') { c.fillStyle = '#fff'; c.fillRect(-18, -6, 36, 12); c.strokeRect(-18, -6, 36, 12); c.moveTo(-18, 0); c.lineTo(18, 0); }
    else if (expr === 'nervous') { c.moveTo(-12, 4); c.lineTo(-4, 0); c.lineTo(4, 4); c.lineTo(12, 0); }
    else { c.moveTo(-11, -1); c.quadraticCurveTo(0, 6, 11, -1); }
    c.stroke();
  }
  c.restore();
  // face shadow (creepy)
  if (st.shadow) {
    c.save(); facePath(c); c.clip();
    const g = c.createLinearGradient(0, -80, 0, 70);
    g.addColorStop(0, `rgba(40,10,70,${0.85 * st.shadow})`); g.addColorStop(0.7, `rgba(40,10,70,${0.55 * st.shadow})`); g.addColorStop(1, 'rgba(40,10,70,0)');
    c.fillStyle = g; c.fillRect(-120, -140, 240, 220); c.restore();
  }
  // front hair
  c.fillStyle = o.hair;
  c.beginPath(); c.moveTo(-106, 14); c.bezierCurveTo(-118, -170, 118, -170, 106, 14);
  const tips = o.style === 'messy' ? [-6, -40, 4, -34, -8, -28] : o.style === 'short' ? [-14, -22, -10, -20, -16, -12] : [10, -30, -4, -24, -18, 2];
  const n = tips.length;
  for (let k = 0; k < n; k++) {
    const x0 = 106 - k * (212 / n), x1 = 106 - (k + 1) * (212 / n);
    c.quadraticCurveTo((x0 + x1) / 2 + 6, -40, (x0 + x1) / 2, tips[k]);
    c.quadraticCurveTo((x0 + x1) / 2 - 4, -46, x1, k === n - 1 ? 14 : -62);
  }
  c.closePath(); c.fill();
  if (o.style === 'messy') {
    [[-60, -120, -95, -170], [-10, -136, -20, -192], [44, -128, 80, -178], [84, -96, 128, -120]].forEach(([x, y, tx, ty]) => {
      c.beginPath(); c.moveTo(x - 26, y + 14); c.quadraticCurveTo(x, y - 10, tx, ty); c.quadraticCurveTo(x + 10, y, x + 28, y + 16); c.fill();
    });
  }
  if (o.ahoge) {
    c.strokeStyle = o.hair; c.lineWidth = 9; c.lineCap = 'round';
    c.beginPath(); c.moveTo(4, -138); c.bezierCurveTo(20, -200, 70, -190, 40 + Math.sin(T * 6) * 6, -160); c.stroke();
  }
  c.strokeStyle = o.hairHi; c.globalAlpha = .55; c.lineWidth = 9; c.lineCap = 'round';
  c.beginPath(); c.arc(0, -40, 84, Math.PI * 1.18, Math.PI * 1.42); c.stroke();
  c.beginPath(); c.arc(0, -40, 84, Math.PI * 1.55, Math.PI * 1.78); c.stroke();
  c.globalAlpha = 1;
  if (o.style === 'pony') { c.fillStyle = '#e0344f'; c.beginPath(); c.arc(84, -100, 13, 0, 7); c.fill(); }
  // glasses
  if (o.glasses) {
    [-1, 1].forEach(sd => {
      c.save(); c.translate(sd * 40, 22);
      c.beginPath();
      if (o.glasses === 'round') c.ellipse(0, 0, 34, 32, 0, 0, 7);
      else c.roundRect(-38, -26, 76, 54, 10);
      if (glint > 0) { c.fillStyle = `rgba(255,255,255,${0.92 * glint})`; c.fill(); }
      else { c.fillStyle = 'rgba(190,220,255,.16)'; c.fill(); }
      c.strokeStyle = '#1b1b28'; c.lineWidth = 5; c.stroke();
      if (glint > 0) {
        c.strokeStyle = `rgba(200,230,255,${glint})`; c.lineWidth = 6;
        c.beginPath(); c.moveTo(-20, 16); c.lineTo(4, -18); c.moveTo(-4, 20); c.lineTo(18, -10); c.stroke();
      } else {
        c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(-22, 12); c.lineTo(-6, -12); c.stroke();
      }
      c.restore();
    });
    c.strokeStyle = '#1b1b28'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(-6, 16); c.quadraticCurveTo(0, 10, 6, 16); c.stroke();
  }
  // manga marks
  if (st.vein) {
    c.save(); c.translate(-62, -84); c.strokeStyle = '#e8202a'; c.lineWidth = 7; c.lineCap = 'round';
    const k = 1 + Math.sin(T * 20) * 0.12; c.scale(k, k);
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([a, b]) => { c.beginPath(); c.moveTo(a * 6, b * 22); c.quadraticCurveTo(a * 6, b * 6, a * 22, b * 6); c.stroke(); });
    c.restore();
  }
  if (st.sweat) {
    c.save(); c.translate(100, -50 + Math.sin(T * 4) * 4);
    c.fillStyle = '#9fd8ff'; c.strokeStyle = '#3a7bd5'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, -30); c.quadraticCurveTo(18, 0, 14, 10); c.arc(0, 10, 14, 0, Math.PI); c.quadraticCurveTo(-18, 0, 0, -30); c.fill(); c.stroke();
    c.restore();
  }
  if (st.gloom) {
    c.save(); facePath(c); c.clip();
    c.strokeStyle = 'rgba(60,70,160,.55)'; c.lineWidth = 4;
    for (let x = -70; x <= 70; x += 14) { c.beginPath(); c.moveTo(x, -110); c.lineTo(x, -110 + 70 + (x % 28 ? 20 : 0)); c.stroke(); }
    c.restore();
  }
}

function drawBust(c, x, y, s, o, st, pose) {
  c.save(); c.translate(x, y); c.rotate(st.tilt || 0); c.scale(s, s);
  drawBody(c, o, pose);
  if (pose && pose.armBehind) pose.armBehind(c);
  drawHead(c, o, st);
  if (pose && pose.arm) pose.arm(c);
  c.restore();
}

function drawStudentBack(c, x, y, s, o) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = o.outfit === 'girl' ? '#2d3a66' : '#283456';
  c.beginPath(); c.moveTo(-40, 50); c.bezierCurveTo(-130, 60, -175, 110, -185, 280); c.lineTo(185, 280); c.bezierCurveTo(175, 110, 130, 60, 40, 50); c.fill();
  c.strokeStyle = '#1d2747'; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 60); c.lineTo(0, 280); c.stroke();
  c.fillStyle = '#f6f7fb'; c.beginPath(); c.ellipse(0, 52, 46, 14, 0, 0, 7); c.fill();
  c.fillStyle = '#f2c9b0'; c.fillRect(-26, 10, 52, 44);
  c.fillStyle = o.skin; [-1, 1].forEach(sd => { c.beginPath(); c.ellipse(sd * 94, -28, 14, 22, 0, 0, 7); c.fill(); });
  c.fillStyle = o.hair;
  c.beginPath(); c.ellipse(0, -52, 100, 106, 0, 0, 7); c.fill();
  if (o.style === 'pony') {
    c.beginPath(); c.moveTo(-26, -40); c.quadraticCurveTo(-50, 80, 0, 150 + Math.sin(T * 3) * 6); c.quadraticCurveTo(50, 80, 26, -40); c.fill();
    c.fillStyle = '#e0344f'; c.beginPath(); c.arc(0, -40, 16, 0, 7); c.fill();
  } else if (o.style === 'long') {
    c.beginPath(); c.moveTo(-98, -50); c.lineTo(-104, 110); c.quadraticCurveTo(0, 140, 104, 110); c.lineTo(98, -50); c.fill();
  } else if (o.style === 'messy') {
    [[-60, -140], [0, -168], [55, -150], [96, -100]].forEach(([tx, ty]) => {
      c.beginPath(); c.moveTo(tx - 40, ty + 60); c.lineTo(tx, ty); c.lineTo(tx + 30, ty + 64); c.fill();
    });
  }
  c.strokeStyle = o.hairHi; c.globalAlpha = .4; c.lineWidth = 10;
  c.beginPath(); c.arc(0, -60, 78, Math.PI * 1.15, Math.PI * 1.75); c.stroke(); c.globalAlpha = 1;
  c.restore();
}

// ---------- environment ----------
function drawFocusLines(c, cx, cy, r0, color, alpha, n, seed) {
  const R = rng(seed);
  c.save(); c.fillStyle = color; c.globalAlpha = alpha;
  for (let i = 0; i < n; i++) {

    c.fillStyle = '#e8332f'; c.strokeStyle = '#7a1010'; c.lineWidth = 3; c.beginPath(); c.roundRect(-46, -30, 92, 60, 6); c.fill(); c.stroke();
    c.fillStyle = '#ffe14d'; c.font = '30px BHS'; c.textAlign = 'center'; c.fillText('스프', 0, 11); c.restore();
    if (t > 19.0) { sparkle(c, 455, sy - 30, 16, (Math.sin(t * 10) + 1) / 2); sparkle(c, 350, sy + 26, 10, (Math.cos(t * 9) + 1) / 2); }
    return;
  }
  // a single hair strand floating
  c.save(); c.strokeStyle = '#34477d'; c.lineWidth = 3; c.globalAlpha = prog(t, 18.6, 19.0);
  c.beginPath(); const hy = 160 + Math.sin(t * 2) * 10; c.moveTo(380, hy); c.bezierCurveTo(400, hy - 40, 440, hy + 30, 460, hy - 10); c.stroke();
  if (t > 19.0) { sparkle(c, 470, hy - 14, 14, (Math.sin(t * 10) + 1) / 2); }
  c.restore();
}
function drawCupRamen(c, t, x, y) {
  c.save(); c.translate(x, y);
  // steam
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 6; c.lineCap = 'round';
  for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * 30, -130); c.bezierCurveTo(i * 30 - 20, -170, i * 30 + 20, -200, i * 30 + Math.sin(t * 3 + i) * 8, -240); c.stroke(); }
  // cup
  c.fillStyle = '#fff'; c.strokeStyle = '#5a3a2a'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(-80, -120); c.lineTo(80, -120); c.lineTo(62, 20); c.lineTo(-62, 20); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#e8332f'; c.beginPath(); c.moveTo(-76, -90); c.lineTo(76, -90); c.lineTo(70, -40); c.lineTo(-70, -40); c.closePath(); c.fill();
  c.fillStyle = '#fff'; c.font = '28px BHS'; c.textAlign = 'center'; c.fillText('쌤 거', 0, -54);
  c.fillStyle = '#ffd36b'; c.beginPath(); c.ellipse(0, -120, 80, 14, 0, 0, 7); c.fill(); c.stroke();
  // chopsticks
  c.strokeStyle = '#b0773d'; c.lineWidth = 7;
  c.beginPath(); c.moveTo(-20, -126); c.lineTo(-90, -230); c.moveTo(0, -126); c.lineTo(-60, -240); c.stroke();
  c.restore();
}
function drawToyCar(c, t, x, y) {
  // a tiny pink compact car toy
  c.save(); c.translate(x, y); c.rotate(-0.06);
  c.fillStyle = '#ff9ec4'; c.strokeStyle = '#5a3a2a'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(-90, 0); c.lineTo(-90, -40); c.quadraticCurveTo(-70, -100, 0, -100); c.quadraticCurveTo(70, -100, 90, -40); c.lineTo(90, 0); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#d8f0ff'; c.beginPath(); c.moveTo(-60, -45); c.quadraticCurveTo(-50, -84, 0, -84); c.quadraticCurveTo(50, -84, 60, -45); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#2a2a33'; [-55, 55].forEach(wx => { c.beginPath(); c.arc(wx, 2, 20, 0, 7); c.fill(); });
  c.fillStyle = '#fff'; c.font = '22px BHS'; c.textAlign = 'center'; c.fillText('경차', 0, -14);
  c.restore();
}
function shotHanaSwear(c, t) {
  // everything freezes grey; 하나 goes dead-eyed and unloads
  c.fillStyle = '#4a4650'; c.fillRect(0, 0, W, H);
  drawFocusLines(c, 640, 320, 300, '#2a2630', 1, 110, 77 + Math.floor(t * 10));
  const snap = easeOut(prog(t, 19.0, 19.15));
  const z = lerp(1.25, 1.0, snap) + 0.04 * prog(t, 19.15, 21.5);
  c.save(); c.translate(640, 320); c.scale(z, z); c.translate(-640, -320);
  drawBust(c, 640, 300, 1.25, CAST.hana, { mouth: talk('하나', t), blink: 0, expr: 'dead', gloom: true, tilt: 0.03 });
  c.restore();
  // 민준's shoulder in the foreground, trembling
  drawStudentBack(c, 1180 + Math.sin(t * 50) * 3, 560, 0.9, CAST.minjun);
  const k = backOut(prog(t, 19.2, 19.45));
  if (k > 0) {
    c.save(); c.translate(250, 140); c.rotate(-0.12); c.scale(k, k);
    c.font = '54px BHS'; c.textAlign = 'center'; c.lineWidth = 10; c.strokeStyle = '#120a14'; c.strokeText('(정색)', 0, 0);
    c.fillStyle = '#ff4a5a'; c.fillText('(정색)', 0, 0); c.restore();
  }
}
function shotTaeo(c, t) {
  closeupBG(c, t, 95);
  const wake = easeOut(prog(t, 25.25, 25.7));
  if (wake > 0 && wake < 1) drawFocusLines(c, 640, 300, 250, '#fff', 0.8 * (1 - wake), 70, 31);
  // desk
  c.fillStyle = '#d9b07c'; c.fillRect(0, 590, W, 130); c.fillStyle = '#a77d4c'; c.fillRect(0, 590, W, 12);
  if (EP.taeoProp === 'cupramen') drawCupRamen(c, t, 930, 600);
  else if (EP.taeoProp === 'toycar') drawToyCar(c, t, 960, 610);
  else { c.fillStyle = '#fff'; c.save(); c.translate(860, 620); c.rotate(-.1); c.fillRect(0, 0, 220, 80);
  c.strokeStyle = '#9fb7e0'; c.lineWidth = 2; for (let y = 16; y < 80; y += 14) { c.beginPath(); c.moveTo(6, y); c.lineTo(214, y); c.stroke(); } c.restore(); }
  const y = lerp(560, 300, wake), tilt = lerp(-0.9, -0.04, wake);
  drawBust(c, 620, y, 1.22, CAST.taeo, {
    mouth: talk('태오', t), blink: wake < 0.5 ? 1 : blinkAt(t, 0.2), expr: 'sleepy', tilt,
  });
  if (wake < 0.6) {
    c.save(); c.font = '58px BHS'; c.fillStyle = '#5a7ad0'; c.globalAlpha = 1 - wake * 1.6;
    ['Z', 'z', 'Z'].forEach((z, i) => c.fillText(z, 800 + i * 50, 260 - i * 50 + Math.sin(t * 3 + i) * 8));
    c.restore();
  }
  // drool / sleep bubble
  if (wake < 0.3) { c.save(); c.globalAlpha = .7; c.strokeStyle = '#7ac8ff'; c.lineWidth = 4; c.beginPath(); c.arc(520, 560, 20 + Math.sin(t * 4) * 6, 0, 7); c.stroke(); c.restore(); }
}
function shotGasp(c, t) {
  const sh = (1 - prog(t, 27.55, 28.2)) * 10;
  c.save(); c.translate(Math.sin(t * 80) * sh, Math.cos(t * 70) * sh);
  c.translate(640, 300); c.scale(1.04, 1.04); c.translate(-640, -300);
  drawClassroomWide(c, t, { roster: roster(true), teacherExpr: 'normal' });
  c.restore();
  c.fillStyle = `rgba(255,255,255,${0.6 * (1 - prog(t, 27.5, 27.62))})`; c.fillRect(0, 0, W, H);
  // silence caption
  c.save(); c.globalAlpha = prog(t, 27.9, 28.05); c.font = '44px BHS'; c.textAlign = 'center'; c.fillStyle = '#fff';
  c.strokeStyle = '#201020'; c.lineWidth = 8; c.strokeText('(정적)', 640, 70); c.fillText('(정적)', 640, 70); c.restore();
}
function shotTeacherFinal(c, t) {
  const mad = EP.finale === 'angry';
  c.fillStyle = mad ? '#3a0a0a' : '#1a0e2c'; c.fillRect(0, 0, W, H);
  drawFocusLines(c, 640, 330, 380, mad ? '#a8201a' : '#3a2a60', 1, 120, 9 + Math.floor(t * 12));
  const z = lerp(1, 1.08, easeOut(prog(t, 28.3, 30)));
  c.save(); c.translate(640, 330); c.scale(z, z); c.translate(-640, -330);
  const glint = prog(t, 28.55, 28.65);
  const angry = EP.finale === 'angry';
  drawBust(c, 640 + (angry ? Math.sin(t * 70) * 5 : 0), 370, 2.0, CAST.teacher, { mouth: talk(TEACHER, t), expr: angry ? 'angry' : 'smug', glint, shadow: angry ? 0 : .55, vein: angry });
  c.restore();
  if (t > 28.55) {
    const a = prog(t, 28.55, 28.75) * (1 - prog(t, 29.1, 29.4));
    sparkle(c, 640 + 120, 370, 70 * a + 1, a);
    sparkle(c, 640 - 60, 400, 40 * a + 1, a);
  }
  // next episode card
  const e = prog(t, 29.25, 29.55);
  if (e > 0) {
    c.save(); c.globalAlpha = e; c.fillStyle = 'rgba(10,4,20,.6)'; c.fillRect(0, 0, W, 120);
    c.font = '30px Jua'; c.fillStyle = '#c9b6ff'; c.textAlign = 'right'; c.fillText('다음 화', 1240, 52);
    c.font = '46px BHS'; c.fillStyle = '#fff'; c.fillText(EP.next, 1240, 102); c.restore();
  }
}

// ---------- overlays ----------
function drawTitleCard(c, t) {
  if (t > 2.9) return;
  const a = prog(t, 0.1, 0.5) * (1 - prog(t, 2.4, 2.85));
  c.save(); c.globalAlpha = a;
  c.fillStyle = 'rgba(20,10,30,.55)'; c.fillRect(0, 250, W, 210);
  const x = lerp(-200, 0, easeOut(prog(t, 0.1, 0.7)));
  c.translate(x, 0); c.textAlign = 'center';
  c.font = '34px Jua'; c.fillStyle = '#ffd98a'; c.fillText(EP.period, 640, 300);
  c.font = '110px BHS'; c.lineWidth = 10; c.strokeStyle = '#2a0d1c'; c.strokeText(EP.title, 640, 412);
  const g = c.createLinearGradient(0, 330, 0, 420); g.addColorStop(0, '#fff'); g.addColorStop(1, '#ff8fc0');
  c.fillStyle = g; c.fillText(EP.title, 640, 412);
  c.restore();
  // bell notes
  c.save(); c.globalAlpha = 1 - prog(t, 2.2, 2.6); c.font = '40px Jua'; c.fillStyle = '#5a3a2a';
  ['딩', '동', '댕', '동 ♪'].forEach((s, i) => { const k = prog(t, 0.15 + i * 0.5, 0.35 + i * 0.5); if (k > 0) c.fillText(s, 980 + i * 60, 70 - backOut(k) * 16 + 16); });
  c.restore();
}
function wrapText(c, text, maxW) {
  if (c.measureText(text).width <= maxW) return [text];
  const words = text.split(' '); const out = []; let cur = '';
  for (const w of words) { const n = cur ? cur + ' ' + w : w; if (c.measureText(n).width > maxW && cur) { out.push(cur); cur = w; } else cur = n; }
  if (cur) out.push(cur); return out;
}
function drawSubtitle(c, t) {
  const l = LINES.find(l => t >= l.s && t < l.e);
  if (!l) return;
  const a = prog(t, l.s, l.s + 0.12) * (1 - prog(t, l.e - 0.12, l.e));
  const n = Math.ceil(l.text.length * prog(t, l.s, l.s + (l.e - l.s) * l.speak));
  c.save(); c.globalAlpha = a; c.font = '34px Jua';
  const full = wrapText(c, l.text, 1000);
  const boxH = 30 + full.length * 46;
  const y0 = H - 24 - boxH;
  c.fillStyle = 'rgba(14,8,24,.78)'; c.beginPath(); c.roundRect(110, y0, 1060, boxH, 18); c.fill();
  c.strokeStyle = l.col; c.lineWidth = 3; c.stroke();
  c.font = '26px BHS'; const nw = c.measureText(l.who).width + 36;
  c.fillStyle = l.col; c.beginPath(); c.roundRect(130, y0 - 22, nw, 40, 12); c.fill();
  c.fillStyle = '#1a0e24'; c.fillText(l.who, 148, y0 + 8);
  c.font = '34px Jua'; c.fillStyle = '#fff';
  let left = n;
  full.forEach((ln, i) => { const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1; c.fillText(part, 150, y0 + 58 + i * 46); });
  c.restore();
}

// ---------- master ----------
const SHOT_FNS = {
  wide: shotWide, hana: shotHana, teacher: (c, t) => shotTeacherMid(c, t, false), minjun: shotMinjun,
  hanaSwear: shotHanaSwear, teacherDark: (c, t) => shotTeacherMid(c, t, true), taeo: shotTaeo,
  gasp: shotGasp, final: shotTeacherFinal,
};
const DEFAULT_SHOTS = [
  [0, 7.8, 'wide'], [7.8, 11.8, 'hana'], [11.8, 17.0, 'teacher'], [17.0, 21.0, 'minjun'],
  [21.0, 25.15, 'teacherDark'], [25.15, 27.5, 'taeo'], [27.5, 28.3, 'gasp'], [28.3, 30.01, 'final'],
];
const SHOTS = (EP.shots || DEFAULT_SHOTS).map(([a, b, name]) => [a, b, SHOT_FNS[name]]);
function renderFrame(t) {
  T = t;
  const c = ctx;
  c.save(); c.clearRect(0, 0, W, H);
  const shot = SHOTS.find(s => t >= s[0] && t < s[1]) || SHOTS[SHOTS.length - 1];
  shot[2](c, t);
  // cut flash
  const since = t - shot[0];
  if (shot[0] > 0 && since < 0.07) { c.fillStyle = `rgba(255,255,255,${0.5 * (1 - since / 0.07)})`; c.fillRect(0, 0, W, H); }
  drawTitleCard(c, t);
  drawSubtitle(c, t);
  // vignette
  const vg = c.createRadialGradient(640, 360, 420, 640, 360, 820);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  // fade in / out
  const f = Math.max(1 - prog(t, 0, 0.35), prog(t, 29.75, 30));
  if (f > 0) { c.fillStyle = `rgba(0,0,0,${f})`; c.fillRect(0, 0, W, H); }
  c.restore();
}
window.renderFrame = renderFrame;

const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
window.ready = Promise.all([document.fonts.load('40px Jua'), document.fonts.load('40px BHS')]).then(() => { renderFrame(isRender ? 0 : 1.2); return true; });

// playback
const audio = document.getElementById('bgm');
audio.src = `soundtrack_ep${EP_NUM}.m4a`;
document.getElementById('play').onclick = () => {
  audio.currentTime = 0; audio.play().catch(() => {});
  const start = performance.now();
  const loop = () => {
    const t = audio.paused || !isFinite(audio.duration) ? (performance.now() - start) / 1000 : audio.currentTime;
    renderFrame(Math.min(t, DUR - 0.001));
    if (t < DUR) requestAnimationFrame(loop);
  };
  loop();
};
</script>
